<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="auto">
  <defs>
    <!-- Background Aurora &amp; Spotlights -->
    <radialGradient id="brandSpotlight" cx="22%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="brandCyanAura" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Glassmorphism Gradients -->
    <linearGradient id="badgeGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badgeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#7C86FF" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="steppedStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#7C86FF" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>
    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="metallicWordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F1F5F9" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="sheenSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Micro Grid -->
    <pattern id="brandGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.75" />
      <circle cx="24" cy="0" r="0.75" fill="rgba(124,134,255,0.25)" />
    </pattern>

    <!-- Glass Refraction &amp; Glow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="brandWordClip">
      <text x="270" y="152" font-family="'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5px">XENALGO</text>
    </clipPath>
  </defs>

  <style>
    /* GSAP Precision Bezier Stroke Drawing and Ripple Keyframes */
    @keyframes strokeCycle {
      0% { stroke-dashoffset: 480; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -480; }
    }
    @keyframes chromaticRipple {
      0% { r: 12px; opacity: 0.9; stroke-width: 2px; }
      50% { opacity: 0.4; }
      100% { r: 84px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes laserPass {
      0% { transform: translateX(-100px); opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translateX(100px); opacity: 0; }
    }
    @keyframes orbitSpinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbitSpinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes textShimmerSweep {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(550px); }
    }
    @keyframes floatSubtle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .draw-path {
      stroke-dasharray: 480;
      animation: strokeCycle 7s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .ripple-1 { animation: chromaticRipple 2.8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .ripple-2 { animation: chromaticRipple 2.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s infinite; }
    .ripple-3 { animation: chromaticRipple 2.8s cubic-bezier(0.16, 1, 0.3, 1) 1.8s infinite; }
    .laser-line { animation: laserPass 3.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .orbit-cw {
      transform-origin: 135px 150px;
      animation: orbitSpinClockwise 18s linear infinite;
    }
    .orbit-ccw {
      transform-origin: 135px 150px;
      animation: orbitSpinCounter 24s linear infinite;
    }
    .shimmer-text { animation: textShimmerSweep 4.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .badge-float { animation: floatSubtle 6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .draw-path, .ripple-1, .ripple-2, .ripple-3, .laser-line,
      .orbit-cw, .orbit-ccw, .shimmer-text, .badge-float {
        animation: none !important;
      }
    }
  </style>

  <!-- Obsidian Canvas Floor -->
  <rect width="800" height="300" fill="#060609" rx="20" />
  <rect width="800" height="300" fill="url(#brandGrid)" rx="20" />

  <!-- Aurora Spotlights -->
  <circle cx="140" cy="150" r="160" fill="url(#brandSpotlight)" />
  <circle cx="680" cy="90" r="140" fill="url(#brandCyanAura)" />

  <!-- Sculpted Frosted Liquid Glass Main Badge Container -->
  <g class="badge-float">
    <rect x="25" y="25" width="750" height="250" rx="16" fill="#0A0A14" fill-opacity="0.8" stroke="none" filter="url(#badgeGlow)" />
    <rect x="25" y="25" width="750" height="250" rx="16" fill="url(#badgeGlassGrad)" stroke="url(#badgeBorderGrad)" stroke-width="1" />

    <!-- 0.5px Specular Glass Rim Edge -->
    <path d="M 45 26 L 755 26 A 16 16 0 0 1 774 45" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.75" />
  </g>

  <!-- LEFT: STEPPED 'X' EMBLEM WITH CONTINUOUS STROKE DRAWING &amp; XENON BRIDGE -->
  <g transform="translate(135, 150)">
    <!-- Expanding Chromatic Ripples -->
    <circle class="ripple-1" cx="0" cy="0" r="16" fill="none" stroke="#7C86FF" />
    <circle class="ripple-2" cx="0" cy="0" r="16" fill="none" stroke="#38BDF8" />
    <circle class="ripple-3" cx="0" cy="0" r="16" fill="none" stroke="#A5B4FC" />

    <!-- Precision Concentric Orbit Rings with Coordinate Gauges -->
    <circle class="orbit-cw" cx="0" cy="0" r="80" fill="none" stroke="rgba(124,134,255,0.22)" stroke-width="1" stroke-dasharray="8 12 32 8" />
    <circle class="orbit-ccw" cx="0" cy="0" r="70" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1.2" stroke-dasharray="24 16 4 16" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.75" />

    <!-- Stepped X Solid Glass Facets -->
    <!-- Top-Left Facet -->
    <path d="M -46 -54 L -24 -54 L -2 -20 L -16 -6 Z" fill="#131326" stroke="rgba(124,134,255,0.35)" stroke-width="1.2" />
    <!-- Bottom-Right Facet -->
    <path d="M 16 6 L 2 20 L 24 54 L 46 54 Z" fill="#131326" stroke="rgba(124,134,255,0.35)" stroke-width="1.2" />
    <!-- Top-Right Facet -->
    <path d="M 46 -54 L 24 -54 L 2 -20 L 16 -6 Z" fill="#1A1A32" stroke="rgba(56,189,248,0.35)" stroke-width="1.2" />
    <!-- Bottom-Left Facet -->
    <path d="M -16 6 L -2 20 L -24 54 L -46 54 Z" fill="#1A1A32" stroke="rgba(56,189,248,0.35)" stroke-width="1.2" />

    <!-- Continuous GSAP-Style Stroke Drawing Paths -->
    <path class="draw-path" d="M -46 -54 L -24 -54 L -2 -20 L -16 -6 Z" fill="none" stroke="url(#steppedStrokeGrad)" stroke-width="2.2" />
    <path class="draw-path" d="M 16 6 L 2 20 L 24 54 L 46 54 Z" fill="none" stroke="url(#steppedStrokeGrad)" stroke-width="2.2" />
    <path class="draw-path" d="M 46 -54 L 24 -54 L 2 -20 L 16 -6 Z" fill="none" stroke="url(#steppedStrokeGrad)" stroke-width="2.2" />
    <path class="draw-path" d="M -16 6 L -2 20 L -24 54 L -46 54 Z" fill="none" stroke="url(#steppedStrokeGrad)" stroke-width="2.2" />

    <!-- Glowing Xenon Bridge Traversal (The Quantum Core) -->
    <circle cx="0" cy="0" r="7" fill="#0A0A14" stroke="#7C86FF" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#38BDF8" />
    <line class="laser-line" x1="-30" y1="0" x2="30" y2="0" stroke="url(#laserBeamGrad)" stroke-width="3" filter="url(#badgeGlow)" />
  </g>

  <!-- RIGHT: LUXURY TYPOGRAPHY &amp; AUTHOR CREDIT (DECOYINDIA // SUBHAM JENA) -->
  <g>
    <!-- Eyebrow Tag -->
    <g transform="translate(270, 75)">
      <rect x="0" y="0" width="280" height="22" rx="4" fill="rgba(124,134,255,0.1)" stroke="rgba(124,134,255,0.25)" stroke-width="0.75" />
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#7C86FF" letter-spacing="1.5px">
        DECOYINDIA // QUANTITATIVE SYSTEMS
      </text>
    </g>

    <!-- Main Metallic Brand Typography -->
    <text x="270" y="152" font-family="'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900" fill="url(#metallicWordGrad)" letter-spacing="-1.5px">
      XENALGO
    </text>
    <!-- Shimmer Highlight Layer -->
    <g clip-path="url(#brandWordClip)">
      <rect class="shimmer-text" x="270" y="90" width="100" height="80" fill="url(#sheenSweep)" opacity="0.85" />
    </g>

    <!-- Subtitle &amp; Domain Tagline -->
    <text x="270" y="180" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#94A3B8">
      Autonomous Quantitative Swing-Trading Architecture for NSE Equities
    </text>

    <!-- Micro Metadata Badges -->
    <g transform="translate(270, 204)">
      <!-- Badge 1: Engineer -->
      <rect x="0" y="0" width="195" height="24" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
      <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748B">ARCHITECT:</text>
      <text x="75" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#E2E8F0">SUBHAM JENA</text>

      <!-- Badge 2: Invariants -->
      <rect x="205" y="0" width="130" height="24" rx="4" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.25)" stroke-width="0.75" />
      <text x="215" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10B981">SI-1..SI-12 VETO</text>

      <!-- Badge 3: Governor -->
      <rect x="345" y="0" width="130" height="24" rx="4" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.25)" stroke-width="0.75" />
      <text x="355" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8">2.0 OPS GOVERNOR</text>
    </g>

    <!-- Live Status Indicator -->
    <g transform="translate(680, 50)">
      <circle cx="0" cy="0" r="4" fill="#10B981" />
      <text x="10" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10B981">ONLINE</text>
    </g>
  </g>

  <!-- Darkroom Engineering Coordinate Corner Ticks -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="0.75">
    <path d="M 32 32 L 42 32 M 32 32 L 32 42" />
    <path d="M 768 32 L 758 32 M 768 32 L 768 42" />
    <path d="M 32 268 L 42 268 M 32 268 L 32 258" />
    <path d="M 768 268 L 758 268 M 768 268 L 768 258" />
  </g>
</svg>

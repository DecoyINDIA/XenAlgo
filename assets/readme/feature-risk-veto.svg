<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="auto">
  <defs>
    <radialGradient id="vetoGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="passGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="barrierGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#7C86FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="vetoGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes barrierPulse {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 4px #7C86FF); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #38BDF8); }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes alertBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #EF4444); }
      50% { opacity: 0.4; filter: none; }
    }
    @keyframes passBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10B981); }
      50% { opacity: 0.4; filter: none; }
    }

    .barrier-line {
      animation: barrierPulse 2.5s ease-in-out infinite;
    }
    .flow-stream {
      stroke-dasharray: 6 6;
      animation: streamFlow 1.8s linear infinite;
    }
    .alert-dot {
      animation: alertBlink 1.8s ease-in-out infinite;
    }
    .pass-dot {
      animation: passBlink 2.2s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .barrier-line, .flow-stream, .alert-dot, .pass-dot {
        animation: none !important;
      }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="900" height="400" rx="16" fill="#0A0A0F" stroke="#222234" stroke-width="1.5" />
  <rect width="900" height="400" fill="url(#vetoGrid)" rx="16" />
  <circle cx="200" cy="200" r="180" fill="url(#vetoGlow)" />
  <circle cx="750" cy="160" r="150" fill="url(#passGlow)" />

  <!-- HEADER -->
  <g transform="translate(40, 36)">
    <text font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">
      RISK ENGINE: PURE VETO LAYER
    </text>
    <text y="22" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="400" font-size="12" fill="#94A3B8">
      Pure functional risk gate: zero I/O, zero state mutation. 100% test coverage with zero bypass paths.
    </text>
  </g>

  <!-- LEFT: INCOMING STRATEGY ORDER STREAM -->
  <g transform="translate(40, 95)">
    <rect width="230" height="265" rx="10" fill="#10101A" stroke="#232336" stroke-width="1" />
    <rect width="230" height="30" rx="10" fill="#151524" />
    <text x="14" y="20" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#A5B4FC">INCOMING INTENTS</text>
    <text x="175" y="20" font-family="'Cascadia Code', monospace" font-size="10" fill="#71717A">3 ORDERS</text>

    <!-- Order Card 1: Valid TCS -->
    <g transform="translate(10, 42)">
      <rect width="210" height="64" rx="6" fill="#131320" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
      <circle cx="14" cy="18" r="4" fill="#10B981" />
      <text x="26" y="21" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#FFFFFF">TCS.NS // BUY</text>
      <text x="14" y="39" font-family="'Cascadia Code', monospace" font-size="9.5" fill="#94A3B8">Qty: 50 @ ₹3,850 (₹1.92L)</text>
      <text x="14" y="53" font-family="'Cascadia Code', monospace" font-size="9" fill="#10B981">Notional: 1.9% NAV [PASS]</text>
    </g>

    <!-- Order Card 2: Fat-Finger Violation -->
    <g transform="translate(10, 114)">
      <rect width="210" height="64" rx="6" fill="#1A1218" stroke="rgba(239,68,68,0.4)" stroke-width="1" />
      <circle cx="14" cy="18" r="4" fill="#EF4444" />
      <text x="26" y="21" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#FFFFFF">RELIANCE // BUY</text>
      <text x="14" y="39" font-family="'Cascadia Code', monospace" font-size="9.5" fill="#F87171">Qty: 800 @ ₹2,950 (₹23.6L)</text>
      <text x="14" y="53" font-family="'Cascadia Code', monospace" font-size="9" fill="#EF4444">FAT-FINGER: 236% NAV [VETO]</text>
    </g>

    <!-- Order Card 3: Valid INFY -->
    <g transform="translate(10, 186)">
      <rect width="210" height="64" rx="6" fill="#131320" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
      <circle cx="14" cy="18" r="4" fill="#10B981" />
      <text x="26" y="21" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#FFFFFF">INFY.NS // BUY</text>
      <text x="14" y="39" font-family="'Cascadia Code', monospace" font-size="9.5" fill="#94A3B8">Qty: 100 @ ₹1,480 (₹1.48L)</text>
      <text x="14" y="53" font-family="'Cascadia Code', monospace" font-size="9" fill="#10B981">Notional: 1.48% NAV [PASS]</text>
    </g>
  </g>

  <!-- CENTER CONDUITS TO BARRIER -->
  <g>
    <!-- Stream 1 (TCS) -->
    <path d="M 270 165 L 340 165" fill="none" stroke="#232338" stroke-width="2" />
    <path class="flow-stream" d="M 270 165 L 340 165" fill="none" stroke="#10B981" stroke-width="2" />

    <!-- Stream 2 (RELIANCE) -->
    <path d="M 270 238 L 340 238" fill="none" stroke="#232338" stroke-width="2" />
    <path class="flow-stream" d="M 270 238 L 340 238" fill="none" stroke="#EF4444" stroke-width="2" />

    <!-- Stream 3 (INFY) -->
    <path d="M 270 310 L 340 310" fill="none" stroke="#232338" stroke-width="2" />
    <path class="flow-stream" d="M 270 310 L 340 310" fill="none" stroke="#10B981" stroke-width="2" />
  </g>

  <!-- CENTER: THE PURE VETO BARRIER (X: 340 to 570) -->
  <g transform="translate(340, 95)">
    <rect width="230" height="265" rx="10" fill="#10101C" stroke="#7C86FF" stroke-width="1.5" />
    <rect width="230" height="30" rx="10" fill="#18182E" />
    <text x="16" y="20" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#A5B4FC">
      RiskEngine.check()
    </text>
    <rect x="155" y="6" width="62" height="18" rx="4" fill="rgba(124,134,255,0.25)" />
    <text x="186" y="19" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="9" font-weight="700" fill="#A5B4FC">PURE_FN</text>

    <!-- Laser Scanning Beam on Left Border of Barrier -->
    <line class="barrier-line" x1="0" y1="30" x2="0" y2="265" stroke="url(#barrierGrad)" stroke-width="3" />

    <!-- 4 Key Safety Gates -->
    <g transform="translate(12, 42)">
      <!-- Gate 1 -->
      <rect width="206" height="46" rx="6" fill="#141422" stroke="#252538" stroke-width="1" />
      <text x="10" y="18" font-family="'Cascadia Code', monospace" font-size="10" font-weight="700" fill="#FFFFFF">GATE 1: FAT-FINGER</text>
      <text x="10" y="34" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Max Order &lt;= 5% NAV (SI-3)</text>
      <circle cx="190" cy="23" r="4" fill="#7C86FF" />
    </g>

    <g transform="translate(12, 94)">
      <!-- Gate 2 -->
      <rect width="206" height="46" rx="6" fill="#141422" stroke="#252538" stroke-width="1" />
      <text x="10" y="18" font-family="'Cascadia Code', monospace" font-size="10" font-weight="700" fill="#FFFFFF">GATE 2: PRICE COLLAR</text>
      <text x="10" y="34" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">|Limit - LTP| &lt;= 3% Band (SI-4)</text>
      <circle cx="190" cy="23" r="4" fill="#7C86FF" />
    </g>

    <g transform="translate(12, 146)">
      <!-- Gate 3 -->
      <rect width="206" height="46" rx="6" fill="#141422" stroke="#252538" stroke-width="1" />
      <text x="10" y="18" font-family="'Cascadia Code', monospace" font-size="10" font-weight="700" fill="#FFFFFF">GATE 3: LIQUIDITY ADV</text>
      <text x="10" y="34" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Qty &lt;= 1% 30-Day ADV (SI-5)</text>
      <circle cx="190" cy="23" r="4" fill="#7C86FF" />
    </g>

    <g transform="translate(12, 198)">
      <!-- Gate 4 -->
      <rect width="206" height="46" rx="6" fill="#141422" stroke="#252538" stroke-width="1" />
      <text x="10" y="18" font-family="'Cascadia Code', monospace" font-size="10" font-weight="700" fill="#FFFFFF">GATE 4: PORTFOLIO DD</text>
      <text x="10" y="34" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Max Drawdown &lt;= 5% (SI-6)</text>
      <circle cx="190" cy="23" r="4" fill="#7C86FF" />
    </g>
  </g>

  <!-- EXIT CONDUITS -->
  <g>
    <!-- Top Pass Conduit (TCS + INFY) -->
    <path d="M 570 160 L 630 160" fill="none" stroke="#232338" stroke-width="2" />
    <path class="flow-stream" d="M 570 160 L 630 160" fill="none" stroke="#10B981" stroke-width="2" />

    <!-- Bottom Veto Divert Conduit (RELIANCE) -->
    <path d="M 570 270 L 630 270" fill="none" stroke="#232338" stroke-width="2" />
    <path class="flow-stream" d="M 570 270 L 630 270" fill="none" stroke="#EF4444" stroke-width="2" />
  </g>

  <!-- RIGHT: OUTCOME DESTINATIONS -->
  <!-- Outcome Top: APPROVED STREAM -->
  <g transform="translate(630, 95)">
    <rect width="230" height="115" rx="10" fill="#0C1A14" stroke="#10B981" stroke-width="1.2" />
    <circle class="pass-dot" cx="20" cy="22" r="5" fill="#10B981" />
    <text x="34" y="26" font-family="'Cascadia Code', monospace" font-size="12" font-weight="700" fill="#10B981">
      APPROVED FOR ROUTING
    </text>
    <text x="14" y="48" font-family="'Segoe UI', sans-serif" font-size="10" fill="#A7F3D0">
      Orders pass cleanly to the 2-OPS Governor.
    </text>
    <rect x="14" y="60" width="202" height="42" rx="6" fill="#06120D" stroke="rgba(16,185,129,0.3)" stroke-width="0.8" />
    <text x="22" y="78" font-family="'Cascadia Code', monospace" font-size="9.5" fill="#10B981">TCS.NS (50) → GOVERNOR QUEUE</text>
    <text x="22" y="93" font-family="'Cascadia Code', monospace" font-size="9.5" fill="#10B981">INFY.NS (100) → GOVERNOR QUEUE</text>
  </g>

  <!-- Outcome Bottom: QUARANTINED VETO STREAM -->
  <g transform="translate(630, 230)">
    <rect width="230" height="130" rx="10" fill="#1A0D12" stroke="#EF4444" stroke-width="1.2" />
    <circle class="alert-dot" cx="20" cy="22" r="5" fill="#EF4444" />
    <text x="34" y="26" font-family="'Cascadia Code', monospace" font-size="12" font-weight="700" fill="#EF4444">
      VETO QUARANTINE
    </text>
    <text x="14" y="48" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FECACA">
      Zero broker submission. Audit event logged.
    </text>
    <rect x="14" y="58" width="202" height="58" rx="6" fill="#12060A" stroke="rgba(239,68,68,0.3)" stroke-width="0.8" />
    <text x="22" y="75" font-family="'Cascadia Code', monospace" font-size="9" fill="#F87171">RELIANCE.NS: FAT-FINGER</text>
    <text x="22" y="90" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#71717A">ACTION: Discarded &amp; Logged to WAL</text>
    <text x="22" y="104" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#EF4444">ALERT: Telegram Notification Sent</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 50" width="100%" height="auto">
  <defs>
    <!-- Chromatic Dispersion &amp; Glowing Gradients -->
    <linearGradient id="dividerBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#7C86FF" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#7C86FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0" />
    </linearGradient>

    <!-- Dispersion Rims: Cyan &amp; Violet Shifting Stops -->
    <linearGradient id="dispersionCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="48%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="dispersionViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0" />
      <stop offset="52%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Traveling Specular Glint -->
    <linearGradient id="glintGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="centerGemAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="waveBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* GSAP Precision Bezier Motion Keyframes */
    @keyframes glintSweepHorizontal {
      0% { transform: translateX(50px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1100px); opacity: 0; }
    }
    @keyframes gemPulseScale {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #7C86FF); }
      50% { transform: scale(1.2); filter: drop-shadow(0 0 10px #38BDF8); }
    }
    @keyframes rippleExpand {
      0% { r: 6px; opacity: 0.9; }
      100% { r: 24px; opacity: 0; }
    }

    .specular-glint {
      animation: glintSweepHorizontal 4.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .center-diamond {
      transform-origin: 600px 25px;
      animation: gemPulseScale 3s ease-in-out infinite;
    }
    .gem-ripple {
      animation: rippleExpand 2.2s ease-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .specular-glint, .center-diamond, .gem-ripple {
        animation: none !important;
      }
    }
  </style>

  <!-- Obsidian Background Floor -->
  <rect width="1200" height="50" fill="#060609" />

  <!-- Undulating Refractive Fluid Wave Layers -->
  <!-- Layer 1: Chromatic Violet Wave (Dispersion Underlay) -->
  <path fill="none" stroke="url(#dispersionViolet)" stroke-width="1.2" opacity="0.6">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M 50 26 Q 300 21 600 26 T 1150 26;
        M 50 26 Q 300 31 600 24 T 1150 26;
        M 50 26 Q 300 21 600 26 T 1150 26" />
  </path>

  <!-- Layer 2: Chromatic Cyan Wave (Dispersion Overlay) -->
  <path fill="none" stroke="url(#dispersionCyan)" stroke-width="1.2" opacity="0.6">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M 50 24 Q 300 29 600 24 T 1150 24;
        M 50 24 Q 300 19 600 26 T 1150 24;
        M 50 24 Q 300 29 600 24 T 1150 24" />
  </path>

  <!-- Main Razor Beam (Center Optical Axis) -->
  <line x1="60" y1="25" x2="1140" y2="25" stroke="url(#dividerBeamGrad)" stroke-width="1.5" />
  <line x1="400" y1="25" x2="800" y2="25" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" filter="url(#waveBloom)" />

  <!-- Shimmering Traveling Edge Glint -->
  <g class="specular-glint">
    <line x1="0" y1="25" x2="90" y2="25" stroke="url(#glintGlow)" stroke-width="3" filter="url(#waveBloom)" />
    <circle cx="45" cy="25" r="3" fill="#FFFFFF" />
  </g>

  <!-- LEFT: TECHNICAL COORDINATES &amp; MARKER -->
  <g transform="translate(60, 29)">
    <text font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#475569">
      [0x7C86FF // DECOYINDIA // SUBHAM JENA]
    </text>
  </g>

  <!-- CENTER: SCULPTED LIQUID GLASS DIAMOND &amp; CHROMATIC BEACON -->
  <g transform="translate(600, 25)">
    <!-- Expanding Radial Ripple -->
    <circle class="gem-ripple" cx="0" cy="0" r="8" fill="none" stroke="#38BDF8" stroke-width="1" />

    <!-- Center Diamond Crystal Node -->
    <g class="center-diamond">
      <circle cx="0" cy="0" r="16" fill="url(#centerGemAura)" />
      <polygon points="0,-9 9,0 0,9 -9,0" fill="#0C0C18" stroke="#7C86FF" stroke-width="1.5" />
      <polygon points="0,-5 5,0 0,5 -5,0" fill="#38BDF8" />
      <polygon points="0,-2 2,0 0,2 -2,0" fill="#FFFFFF" />
    </g>
  </g>

  <!-- RIGHT: TECHNICAL COORDINATES &amp; MARKER -->
  <g transform="translate(1000, 29)">
    <text font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#475569">
      [SI-1..SI-12 // 2.0 OPS]
    </text>
  </g>
</svg>

    <!-- Fyers REST API -->
    <g transform="translate(14, 34)">
      <rect width="198" height="74" rx="6" fill="#131322" stroke="#2C2C44" stroke-width="1" />
      <text x="10" y="20" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#38BDF8">REST v3 Orders</text>
      <text x="10" y="38" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Static IP Locked Gate</text>
      <text x="10" y="52" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Limit CNC Orders Only</text>
      <text x="10" y="66" font-family="'Cascadia Code', monospace" font-size="8" fill="#71717A">24h Token + SHA256 HMAC</text>
    </g>

    <!-- Fyers WebSocket & NSE -->
    <g transform="translate(228, 34)">
      <rect width="198" height="74" rx="6" fill="#131322" stroke="#2C2C44" stroke-width="1" />
      <text x="10" y="20" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#10B981">WebSocket Feed</text>
      <text x="10" y="38" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Real-time Order &amp; Trade WS</text>
      <text x="10" y="52" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">NSE Equities Matching</text>
      <text x="10" y="66" font-family="'Cascadia Code', monospace" font-size="8" fill="#10B981">Heartbeat Monitored</text>
    </g>
  </g>
</svg>

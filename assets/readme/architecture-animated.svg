    <!-- Module 1: Scheduler & Lifecycle -->
    <g transform="translate(16, 38)">
      <rect width="165" height="142" rx="8" fill="#121322" stroke="#262740" stroke-width="1" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">SCHEDULER &amp; LIFE</text>
      <text x="12" y="38" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#38BDF8">APScheduler + Cron</text>
      <line x1="12" y1="46" x2="153" y2="46" stroke="#1F2034" stroke-width="1" />
      <text x="12" y="64" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• 08:15 Token Check</text>
      <text x="12" y="80" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• 09:00 Pre-Market</text>
      <text x="12" y="96" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• 15:00 Signal Run</text>
      <text x="12" y="112" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• 15:45 EOD Close</text>
      <text x="12" y="130" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#10B981">STATE: ONLINE</text>
    </g>

    <!-- Module 2: Multi-Alpha Engine -->
    <g transform="translate(195, 38)">
      <rect width="165" height="142" rx="8" fill="#121322" stroke="#262740" stroke-width="1" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">ALPHA SLEEVES</text>
      <text x="12" y="38" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#7C86FF">Vectorized Pandas</text>
      <line x1="12" y1="46" x2="153" y2="46" stroke="#1F2034" stroke-width="1" />
      <text x="12" y="64" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Sleeve 1: std30</text>
      <text x="12" y="80" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Sleeve 2: a027</text>
      <text x="12" y="96" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Sleeve 3: a062</text>
      <text x="12" y="112" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Cross-Netting</text>
      <text x="12" y="130" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#7C86FF">ALLOC: 1/3 EACH</text>
    </g>

    <!-- Module 3: Pure Risk Veto -->
    <g transform="translate(374, 38)">
      <rect width="165" height="142" rx="8" fill="#141122" stroke="#7C86FF" stroke-width="1.2" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">RISK ENGINE</text>
      <text x="12" y="38" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#EF4444">Pure Veto Guard</text>
      <line x1="12" y1="46" x2="153" y2="46" stroke="#241E34" stroke-width="1" />
      <text x="12" y="64" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• 12 Pure Invariants</text>
      <text x="12" y="80" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Fat-Finger &lt; 5%</text>
      <text x="12" y="96" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Price Collar 3%</text>
      <text x="12" y="112" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Liquidity ADV 1%</text>
      <text x="12" y="130" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#10B981">ZERO BYPASS</text>
    </g>

    <!-- Module 4: 2-OPS Governor -->
    <g transform="translate(553, 38)">
      <rect width="165" height="142" rx="8" fill="#101524" stroke="#38BDF8" stroke-width="1.2" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">RATE GOVERNOR</text>
      <text x="12" y="38" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#38BDF8">SEBI Token Bucket</text>
      <line x1="12" y1="46" x2="153" y2="46" stroke="#1D253A" stroke-width="1" />
      <text x="12" y="64" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Hard Cap: 2.0 OPS</text>
      <text x="12" y="80" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• SEBI Floor: 10 OPS</text>
      <text x="12" y="96" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• 5x Safety Margin</text>
      <text x="12" y="112" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Burst Cap: 2</text>
      <text x="12" y="130" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#38BDF8">SEBI COMPLIANT</text>
    </g>

    <!-- Module 5: Execution Engine & Reconciler -->
    <g transform="translate(732, 38)">
      <rect width="165" height="142" rx="8" fill="#10181A" stroke="#10B981" stroke-width="1.2" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">EXECUTION &amp; RECON</text>
      <text x="12" y="38" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#10B981">Confirmed Fills</text>
      <line x1="12" y1="46" x2="153" y2="46" stroke="#182A24" stroke-width="1" />
      <text x="12" y="64" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Idempotent CID</text>
      <text x="12" y="80" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• WS Fill Catch</text>
      <text x="12" y="96" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Mutate on Fill</text>
      <text x="12" y="112" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">• Broker Audit</text>
      <text x="12" y="130" font-family="'Cascadia Code', monospace" font-size="8.5" fill="#10B981">ZERO DRIFT</text>
    </g>
  </g>

  <!-- CONNECTOR PIPES FROM CORE TO LOWER TIERS (Y: 370 to 410) -->
  <g>
    <path class="conduit-dash" d="M 270 370 L 270 410" stroke="#7C86FF" stroke-width="2" />
    <path class="conduit-dash" d="M 750 370 L 750 410" stroke="#10B981" stroke-width="2" />
  </g>

  <!-- BOTTOM LAYER: STORAGE (LEFT) & EXTERNAL BROKER (RIGHT) -->
  <!-- Left Box: Storage Layer (DuckDB & SQLite) -->
  <g transform="translate(44, 410)">
    <rect width="440" height="120" rx="10" fill="#10101C" stroke="#25253A" stroke-width="1.2" />
    <rect width="440" height="24" rx="10" fill="#161628" />
    <text x="14" y="16" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#A5B4FC">
      PERSISTENCE &amp; STORAGE PLANE
    </text>

    <!-- DuckDB -->
    <g transform="translate(14, 34)">
      <rect width="198" height="74" rx="6" fill="#131322" stroke="#2C2C44" stroke-width="1" />
      <text x="10" y="20" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#38BDF8">DuckDB EOD</text>
      <text x="10" y="38" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Read-Only in Live Loop</text>
      <text x="10" y="52" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">NIFTY 500 Historical Data</text>
      <text x="10" y="66" font-family="'Cascadia Code', monospace" font-size="8" fill="#71717A">Vectorized Parquet Ingest</text>
    </g>

    <!-- SQLite WAL -->
    <g transform="translate(228, 34)">
      <rect width="198" height="74" rx="6" fill="#131322" stroke="#2C2C44" stroke-width="1" />
      <text x="10" y="20" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#10B981">SQLite (WAL)</text>
      <text x="10" y="38" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Append-Only Event Sourcing</text>
      <text x="10" y="52" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">synchronous=FULL Journal</text>
      <text x="10" y="66" font-family="'Cascadia Code', monospace" font-size="8" fill="#10B981">Deterministic State Replay</text>
    </g>
  </g>

  <!-- Right Box: External Broker & Exchange Gateway -->
  <g transform="translate(516, 410)">
    <rect width="440" height="120" rx="10" fill="#10101C" stroke="#25253A" stroke-width="1.2" />
    <rect width="440" height="24" rx="10" fill="#161628" />
    <text x="14" y="16" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#38BDF8">
      BROKER &amp; EXCHANGE INTERFACE (FYERS API V3)

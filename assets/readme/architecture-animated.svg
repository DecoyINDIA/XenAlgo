<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="auto">
  <defs>
    <radialGradient id="archGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0" />
    </radialGradient>
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes conduitFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }

    .conduit-dash {
      stroke-dasharray: 6 8;
      animation: conduitFlow 2s linear infinite;
    }
    .node-pulse {
      animation: pulseNode 2.5s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .conduit-dash, .node-pulse {
        animation: none !important;
      }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1000" height="560" rx="16" fill="#0A0A0F" stroke="#222234" stroke-width="1.5" />
  <rect width="1000" height="560" fill="url(#archGrid)" rx="16" />
  <rect width="1000" height="560" fill="url(#archGlow)" rx="16" />

  <!-- HEADER -->
  <g transform="translate(44, 38)">
    <text font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">
      XENALGO COMPLETE SYSTEM ARCHITECTURE
    </text>
    <text y="22" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="400" font-size="12.5" fill="#94A3B8">
      Single-process Asyncio monolith on Mumbai VPS with Tailscale encrypted private mesh supervision.
    </text>
  </g>

  <!-- TOP LAYER: OPERATOR SUPERVISION & CONSOLE (Y: 80 to 140) -->
  <g transform="translate(44, 80)">
    <rect width="912" height="65" rx="8" fill="#10101C" stroke="#282840" stroke-width="1.2" />
    <rect width="912" height="22" rx="8" fill="#161628" />
    <text x="14" y="15" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10.5" fill="#A5B4FC">
      SUPERVISION &amp; OVERRIDE PLANE (TAILSCALE ENCRYPTED MESH)
    </text>
    <rect x="790" y="3" width="105" height="16" rx="4" fill="rgba(16,185,129,0.2)" />
    <text x="842" y="14" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="8.5" font-weight="700" fill="#10B981">TAILSCALE ONLY</text>

    <!-- Sub-boxes in Supervision -->
    <g transform="translate(14, 28)">
      <rect width="210" height="28" rx="5" fill="#141424" stroke="#2C2C46" stroke-width="1" />
      <text x="10" y="18" font-family="'Cascadia Code', monospace" font-size="10" fill="#FFFFFF">FastAPI + HTMX Dashboard</text>
    </g>
    <g transform="translate(238, 28)">
      <rect width="210" height="28" rx="5" fill="#141424" stroke="#2C2C46" stroke-width="1" />
      <text x="10" y="18" font-family="'Cascadia Code', monospace" font-size="10" fill="#38BDF8">SSE Live Telemetry &amp; Logs</text>
    </g>
    <g transform="translate(462, 28)">
      <rect width="210" height="28" rx="5" fill="#141424" stroke="#2C2C46" stroke-width="1" />
      <text x="10" y="18" font-family="'Cascadia Code', monospace" font-size="10" fill="#A5B4FC">Telegram Bot (Alerts &amp; Ack)</text>
    </g>
    <g transform="translate(686, 28)">
      <rect width="212" height="28" rx="5" fill="#201016" stroke="#EF4444" stroke-width="1" />
      <text x="10" y="18" font-family="'Cascadia Code', monospace" font-size="10" font-weight="700" fill="#FCA5A5">Triple Kill Switch (Nuke)</text>
    </g>
  </g>

  <!-- CONNECTOR PIPES FROM SUPERVISION TO CORE (Y: 145 to 175) -->
  <g>
    <path class="conduit-dash" d="M 150 145 L 150 175" stroke="#7C86FF" stroke-width="2" />
    <path class="conduit-dash" d="M 370 145 L 370 175" stroke="#38BDF8" stroke-width="2" />
    <path class="conduit-dash" d="M 800 145 L 800 175" stroke="#EF4444" stroke-width="2" />
  </g>


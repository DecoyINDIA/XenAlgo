  <g transform="translate(44, 175)">
    <rect width="912" height="195" rx="10" fill="#0D0E18" stroke="#7C86FF" stroke-width="1.5" />
    <rect width="912" height="26" rx="10" fill="#17182E" />
    <text x="16" y="18" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">
      CORE EXECUTION MONOLITH (SINGLE PYTHON 3.14 ASYNCIO PROCESS)
    </text>
    <text x="730" y="18" font-family="'Cascadia Code', monospace" font-size="10" fill="#A5B4FC">
      MUMBAI VPS // HOSTED INSTANCE

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="auto">
  <defs>
    <radialGradient id="piaGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="scanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0" />
    </linearGradient>
    <pattern id="piaGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes sweepTimeline {
      0% { transform: translateX(30px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(920px); opacity: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #7C86FF); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 8px #38BDF8); }
    }
    @keyframes flowTrack {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes activeGatePulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }

    .scanner-head {
      animation: sweepTimeline 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: flowTrack 2s linear infinite;
    }
    .active-dot {
      animation: nodePulse 2.5s ease-in-out infinite;
    }
    .gate-glow {
      animation: activeGatePulse 2s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .scanner-head, .flow-line, .active-dot, .gate-glow {
        animation: none !important;
      }
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="480" rx="16" fill="#0A0A0F" stroke="#222234" stroke-width="1.5" />
  <rect width="1000" height="480" fill="url(#piaGrid)" rx="16" />
  <rect width="1000" height="480" fill="url(#piaGlow)" rx="16" />

  <!-- HEADER TITLE & METADATA -->
  <g transform="translate(48, 40)">
    <text font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" letter-spacing="0.5">
      DAILY AUTONOMOUS TRADING SESSION TIMELINE
    </text>
    <text y="24" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">
      Deterministic execution sequence from pre-market token handshake to post-market journal reconciliation.
    </text>

    <!-- Legend Badges on Right -->
    <g transform="translate(680, 4)">
      <circle cx="0" cy="0" r="4" fill="#10B981" />
      <text x="10" y="3" font-family="'Cascadia Code', monospace" font-size="10.5" fill="#10B981">SAFE PASS</text>

      <circle cx="100" cy="0" r="4" fill="#38BDF8" />
      <text x="110" y="3" font-family="'Cascadia Code', monospace" font-size="10.5" fill="#38BDF8">EXECUTION</text>

      <circle cx="210" cy="0" r="4" fill="#7C86FF" />
      <text x="220" y="3" font-family="'Cascadia Code', monospace" font-size="10.5" fill="#A5B4FC">AUDIT</text>
    </g>
  </g>

  <!-- HORIZONTAL TIMELINE RAIL (Y = 160) -->
  <g transform="translate(50, 160)">
    <!-- Base track -->
    <line x1="20" y1="0" x2="880" y2="0" stroke="#1F1F30" stroke-width="6" stroke-linecap="round" />
    <line class="flow-line" x1="20" y1="0" x2="880" y2="0" stroke="rgba(124,134,255,0.5)" stroke-width="2" />

    <!-- Moving Scanner Head -->
    <g class="scanner-head" style="transform-origin: 0px 0px;">
      <line x1="0" y1="-25" x2="0" y2="25" stroke="url(#scanBeamGrad)" stroke-width="4" />
      <circle cx="0" cy="0" r="8" fill="#38BDF8" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />
    </g>
  </g>

  <!-- 7 OPERATIONAL NODES -->
  <!-- Node 1: 08:15 Token Refresh -->
  <g transform="translate(65, 120)">
    <!-- Time Tag -->
    <rect x="-35" y="-36" width="70" height="22" rx="4" fill="#12121E" stroke="#38BDF8" stroke-width="0.8" />
    <text x="0" y="-21" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#38BDF8">08:15</text>
    <!-- Connector Dot -->
    <circle cx="0" cy="40" r="8" fill="#161626" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="0" cy="40" r="3" fill="#38BDF8" />
    <!-- Content Card Below -->
    <g transform="translate(-55, 68)">
      <rect width="115" height="180" rx="8" fill="#0E0E18" stroke="#222236" stroke-width="1" />
      <text x="10" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#FFFFFF">1. Auth Sync</text>
      <text x="10" y="42" font-family="'Cascadia Code', monospace" font-size="9" fill="#71717A">MODULE: Token</text>
      <line x1="10" y1="52" x2="105" y2="52" stroke="#1F1F30" stroke-width="1" />
      <text x="10" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• 24h Fyers Token</text>
      <text x="10" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• SHA-256 HMAC</text>
      <text x="10" y="106" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• TOTP Auto-auth</text>
      <rect x="10" y="145" width="95" height="22" rx="4" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="0.8" />
      <text x="57" y="160" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="9" font-weight="700" fill="#10B981">TOKEN_OK</text>
    </g>
  </g>

  <!-- Node 2: 08:30 Data Ingest -->
  <g transform="translate(195, 120)">
    <rect x="-35" y="-36" width="70" height="22" rx="4" fill="#12121E" stroke="#7C86FF" stroke-width="0.8" />
    <text x="0" y="-21" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#A5B4FC">08:30</text>
    <circle cx="0" cy="40" r="8" fill="#161626" stroke="#7C86FF" stroke-width="2.5" />
    <circle cx="0" cy="40" r="3" fill="#7C86FF" />
    <g transform="translate(-55, 68)">
      <rect width="115" height="180" rx="8" fill="#0E0E18" stroke="#222236" stroke-width="1" />
      <text x="10" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#FFFFFF">2. Data Sync</text>
      <text x="10" y="42" font-family="'Cascadia Code', monospace" font-size="9" fill="#71717A">MODULE: Data</text>
      <line x1="10" y1="52" x2="105" y2="52" stroke="#1F1F30" stroke-width="1" />
      <text x="10" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Bhavcopy Pull</text>
      <text x="10" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• DuckDB Sync</text>
      <text x="10" y="106" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• NIFTY 500 EOD</text>
      <rect x="10" y="145" width="95" height="22" rx="4" fill="rgba(124,134,255,0.12)" stroke="#7C86FF" stroke-width="0.8" />
      <text x="57" y="160" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="9" font-weight="700" fill="#A5B4FC">DUCKDB_SYNC</text>
    </g>
  </g>

  <!-- Node 3: 09:00 Pre-Flight Reconcile -->
  <g transform="translate(325, 120)">
    <rect x="-35" y="-36" width="70" height="22" rx="4" fill="#12121E" stroke="#10B981" stroke-width="0.8" />
    <text x="0" y="-21" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#10B981">09:00</text>
    <circle cx="0" cy="40" r="8" fill="#161626" stroke="#10B981" stroke-width="2.5" />
    <circle cx="0" cy="40" r="3" fill="#10B981" />
    <g transform="translate(-55, 68)">
      <rect width="115" height="180" rx="8" fill="#0E0E18" stroke="#222236" stroke-width="1" />
      <text x="10" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#FFFFFF">3. Reconcile</text>
      <text x="10" y="42" font-family="'Cascadia Code', monospace" font-size="9" fill="#71717A">MODULE: Recon</text>
      <line x1="10" y1="52" x2="105" y2="52" stroke="#1F1F30" stroke-width="1" />
      <text x="10" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Journal vs Broker</text>
      <text x="10" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Zero Mismatch</text>
      <text x="10" y="106" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Kill Switches Clr</text>
      <rect x="10" y="145" width="95" height="22" rx="4" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="0.8" />
      <text x="57" y="160" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="9" font-weight="700" fill="#10B981">STARTUP_GATE</text>
    </g>
  </g>

  <!-- Node 4: 15:00 Signal & Veto -->
  <g transform="translate(460, 120)">
    <rect x="-35" y="-36" width="70" height="22" rx="4" fill="#12121E" stroke="#7C86FF" stroke-width="0.8" />
    <text x="0" y="-21" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#A5B4FC">15:00</text>
    <circle class="active-dot" cx="0" cy="40" r="9" fill="#161626" stroke="#7C86FF" stroke-width="3" />
    <circle cx="0" cy="40" r="4" fill="#7C86FF" />
    <g transform="translate(-60, 68)">
      <rect width="125" height="180" rx="8" fill="#121222" stroke="#7C86FF" stroke-width="1.2" />
      <text x="10" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#FFFFFF">4. Alpha + Veto</text>
      <text x="10" y="42" font-family="'Cascadia Code', monospace" font-size="9" fill="#38BDF8">MODULE: RiskEngine</text>
      <line x1="10" y1="52" x2="115" y2="52" stroke="#25253E" stroke-width="1" />
      <text x="10" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• 3 Alpha Sleeves</text>
      <text x="10" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Pure Veto Check</text>
      <text x="10" y="106" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• 12 Invariants OK</text>
      <rect x="10" y="145" width="105" height="22" rx="4" fill="rgba(124,134,255,0.2)" stroke="#7C86FF" stroke-width="0.8" />
      <text x="62" y="160" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="9" font-weight="700" fill="#A5B4FC">VETO_CLEARED</text>
    </g>
  </g>

  <!-- Node 5: 15:05 Limit Order Placement -->
  <g transform="translate(600, 120)">
    <rect x="-35" y="-36" width="70" height="22" rx="4" fill="#12121E" stroke="#38BDF8" stroke-width="0.8" />
    <text x="0" y="-21" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#38BDF8">15:05</text>
    <circle cx="0" cy="40" r="8" fill="#161626" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="0" cy="40" r="3" fill="#38BDF8" />
    <g transform="translate(-55, 68)">
      <rect width="115" height="180" rx="8" fill="#0E0E18" stroke="#222236" stroke-width="1" />
      <text x="10" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#FFFFFF">5. Order Route</text>
      <text x="10" y="42" font-family="'Cascadia Code', monospace" font-size="9" fill="#71717A">MODULE: Governor</text>
      <line x1="10" y1="52" x2="105" y2="52" stroke="#1F1F30" stroke-width="1" />
      <text x="10" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• 2 OPS Rate Limit</text>
      <text x="10" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• correlationId Gen</text>
      <text x="10" y="106" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Limit CNC Orders</text>
      <rect x="10" y="145" width="95" height="22" rx="4" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" stroke-width="0.8" />
      <text x="57" y="160" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="9" font-weight="700" fill="#38BDF8">ROUTED_2OPS</text>
    </g>
  </g>

  <!-- Node 6: 15:20 Confirmed Fills -->
  <g transform="translate(740, 120)">
    <rect x="-35" y="-36" width="70" height="22" rx="4" fill="#12121E" stroke="#10B981" stroke-width="0.8" />
    <text x="0" y="-21" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#10B981">15:20</text>
    <circle cx="0" cy="40" r="8" fill="#161626" stroke="#10B981" stroke-width="2.5" />
    <circle cx="0" cy="40" r="3" fill="#10B981" />
    <g transform="translate(-55, 68)">
      <rect width="115" height="180" rx="8" fill="#0E0E18" stroke="#222236" stroke-width="1" />
      <text x="10" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#FFFFFF">6. Confirmed Fills</text>
      <text x="10" y="42" font-family="'Cascadia Code', monospace" font-size="9" fill="#71717A">MODULE: ExecEngine</text>
      <line x1="10" y1="52" x2="105" y2="52" stroke="#1F1F30" stroke-width="1" />
      <text x="10" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Fyers WS Fills</text>
      <text x="10" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Mutate on Fill</text>
      <text x="10" y="106" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Zero Ghost Fills</text>
      <rect x="10" y="145" width="95" height="22" rx="4" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="0.8" />
      <text x="57" y="160" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="9" font-weight="700" fill="#10B981">TRADED_FILL</text>
    </g>
  </g>

  <!-- Node 7: 15:45 EOD Journal Sync -->
  <g transform="translate(875, 120)">
    <rect x="-35" y="-36" width="70" height="22" rx="4" fill="#12121E" stroke="#7C86FF" stroke-width="0.8" />
    <text x="0" y="-21" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#A5B4FC">15:45</text>
    <circle cx="0" cy="40" r="8" fill="#161626" stroke="#7C86FF" stroke-width="2.5" />
    <circle cx="0" cy="40" r="3" fill="#7C86FF" />
    <g transform="translate(-55, 68)">
      <rect width="115" height="180" rx="8" fill="#0E0E18" stroke="#222236" stroke-width="1" />
      <text x="10" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#FFFFFF">7. EOD Close</text>
      <text x="10" y="42" font-family="'Cascadia Code', monospace" font-size="9" fill="#71717A">MODULE: Journal</text>
      <line x1="10" y1="52" x2="105" y2="52" stroke="#1F1F30" stroke-width="1" />
      <text x="10" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• WAL Checkpoint</text>
      <text x="10" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• State Snapshot</text>
      <text x="10" y="106" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">• Session Locked</text>
      <rect x="10" y="145" width="95" height="22" rx="4" fill="rgba(124,134,255,0.12)" stroke="#7C86FF" stroke-width="0.8" />
      <text x="57" y="160" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="9" font-weight="700" fill="#A5B4FC">SESSION_LOCK</text>
    </g>
  </g>

  <!-- BOTTOM STATUS BANNER -->
  <g transform="translate(48, 410)">
    <rect width="904" height="42" rx="8" fill="#0C0C14" stroke="#1E1E2E" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#10B981" />
    <text x="40" y="25" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">
      Zero Operator Action Required During Live Trading Session.
    </text>
    <text x="415" y="25" font-family="'Segoe UI', sans-serif" font-size="12" fill="#71717A">
      Automated supervision via Tailscale SSE Console with instant manual emergency override.
    </text>
    <rect x="790" y="10" width="100" height="22" rx="4" fill="#161626" stroke="rgba(124,134,255,0.3)" stroke-width="1" />
    <text x="840" y="24" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="10" fill="#38BDF8">AUTONOMOUS</text>
  </g>
</svg>

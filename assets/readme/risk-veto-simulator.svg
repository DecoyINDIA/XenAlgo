<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 460" width="100%" height="auto">
  <defs>
    <!-- Background Aurora &amp; Radar Glows -->
    <radialGradient id="simRadarGlow" cx="72%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="simTermGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Glass Gradients -->
    <linearGradient id="simCardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="simCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#7C86FF" stop-opacity="0.22" />
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="radarSweepCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0" />
    </linearGradient>

    <!-- Micro Grid -->
    <pattern id="simGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.75" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="simGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Radar and Telemetry Kinetic Keyframes */
    @keyframes simRadarRotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes vetoBeaconPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 8px #EF4444); }
    }
    @keyframes passBeaconPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 8px #10B981); }
    }
    @keyframes scanCursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes statusDotFlicker {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #10B981); }
      50% { opacity: 0.4; filter: none; }
    }

    .radar-beam-arm {
      transform-origin: 700px 260px;
      animation: simRadarRotation 6s linear infinite;
    }
    .blip-veto { animation: vetoBeaconPulse 2s ease-in-out infinite; }
    .blip-pass { animation: passBeaconPulse 2.4s ease-in-out infinite; }
    .term-blink { animation: scanCursorBlink 0.9s step-start infinite; }
    .live-dot-green { animation: statusDotFlicker 1.8s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .radar-beam-arm, .blip-veto, .blip-pass, .term-blink, .live-dot-green {
        animation: none !important;
      }
    }
  </style>

  <!-- Obsidian Canvas Floor -->
  <rect width="950" height="460" fill="#060609" rx="20" />
  <rect width="950" height="460" fill="url(#simGrid)" rx="20" />

  <!-- Aurora Mesh Spotlights -->
  <circle cx="700" cy="260" r="220" fill="url(#simRadarGlow)" />
  <circle cx="240" cy="240" r="200" fill="url(#simTermGlow)" />

  <!-- HEADER TITLE &amp; METADATA -->
  <g transform="translate(45, 36)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5px">
      LIVE RISK VETO SIMULATOR &amp; TELEMETRY RADAR
    </text>
    <text y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#94A3B8">
      DECOYINDIA // REAL-TIME MATHEMATICAL EVALUATION ACROSS ALL 12 SAFETY INVARIANTS
    </text>

    <!-- Top Right Status Badges -->
    <g transform="translate(630, -6)">
      <rect x="0" y="0" width="135" height="24" rx="4" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="0.75" />
      <circle class="live-dot-green" cx="12" cy="12" r="3.5" fill="#10B981" />
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10B981">LATENCY: 0.65ms</text>

      <rect x="145" y="0" width="130" height="24" rx="4" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="0.75" />
      <text x="14" y="15" transform="translate(145,0)" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8">SI-1..12 PASS/VETO</text>
    </g>
  </g>

  <!-- Hairline Divider -->
  <line x1="45" y1="76" x2="905" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />

  <!-- LEFT: TERMINAL INSPECTION STREAM (TABLE VIEW) -->
  <g transform="translate(45, 92)">
    <rect width="470" height="295" rx="12" fill="#0C0C18" fill-opacity="0.9" stroke="url(#simCardBorder)" stroke-width="1" />
    <rect width="470" height="28" rx="12" fill="rgba(124,134,255,0.1)" />
    <path d="M 12 1 L 458 1" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.75" />

    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">
      INCOMING ORDER STREAM // LIVE RISK EVALUATION
    </text>
    <circle cx="452" cy="14" r="3.5" fill="#10B981" />

    <!-- Table Header -->
    <g transform="translate(14, 46)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748B">TIME</text>
      <text x="60" y="0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748B">SYMBOL</text>
      <text x="135" y="0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748B">TAG</text>
      <text x="210" y="0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748B">EVALUATION</text>
      <text x="365" y="0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748B">DECISION</text>
      <line x1="0" y1="8" x2="442" y2="8" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
    </g>

    <!-- Table Row 1: RELIANCE (PASS) -->
    <g transform="translate(14, 75)">
      <rect x="-4" y="-12" width="450" height="38" rx="5" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.2)" stroke-width="0.75" />
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">15:00:00.120</text>
      <text x="60" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#E2E8F0">RELIANCE +280</text>
      <text x="135" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#7C86FF">std30</text>
      <text x="210" y="4" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#10B981">SI-1..12 [0.82ms OK]</text>
      <rect x="360" y="-8" width="80" height="22" rx="3" fill="rgba(16,185,129,0.25)" />
      <text x="400" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#10B981">APPROVED</text>
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="500" fill="#64748B">→ Paced via Token Bucket to Fyers API</text>
    </g>

    <!-- Table Row 2: TCS (FAT-FINGER VETO) -->
    <g transform="translate(14, 125)">
      <rect x="-4" y="-12" width="450" height="38" rx="5" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.3)" stroke-width="0.75" />
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">15:00:00.340</text>
      <text x="60" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#EF4444">TCS +5,000</text>
      <text x="135" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#EF4444">MANUAL</text>
      <text x="210" y="4" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#EF4444">GATE SI-9: MARGIN BREACH</text>
      <rect x="360" y="-8" width="80" height="22" rx="3" fill="rgba(239,68,68,0.3)" />
      <text x="400" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#EF4444">VETOED</text>
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="500" fill="#EF4444">→ Deflected at pure barrier; zero broker call</text>
    </g>

    <!-- Table Row 3: HDFCBANK (PRICE COLLAR VETO) -->
    <g transform="translate(14, 175)">
      <rect x="-4" y="-12" width="450" height="38" rx="5" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.3)" stroke-width="0.75" />
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">15:00:00.510</text>
      <text x="60" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#F59E0B">HDFCBANK -100</text>
      <text x="135" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#F59E0B">std30</text>
      <text x="210" y="4" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#F59E0B">GATE SI-10: COLLAR BAND</text>
      <rect x="360" y="-8" width="80" height="22" rx="3" fill="rgba(245,158,11,0.3)" />
      <text x="400" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#F59E0B">VETOED</text>
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="500" fill="#F59E0B">→ Price outside allowable band collar</text>
    </g>

    <!-- Table Row 4: INFY (PASS) -->
    <g transform="translate(14, 225)">
      <rect x="-4" y="-12" width="450" height="38" rx="5" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.2)" stroke-width="0.75" />
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">15:00:00.780</text>
      <text x="60" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#E2E8F0">INFY +120</text>
      <text x="135" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#38BDF8">alpha_062</text>
      <text x="210" y="4" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#38BDF8">SI-1..12 [0.74ms OK]</text>
      <rect x="360" y="-8" width="80" height="22" rx="3" fill="rgba(56,189,248,0.25)" />
      <text x="400" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#38BDF8">APPROVED</text>
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="500" fill="#64748B">→ Paced via Token Bucket to Fyers API</text>
    </g>

    <!-- Table Footer CLI Status -->
    <g transform="translate(14, 276)">
      <text font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#64748B">
        risk_engine.evaluate(intent) → status: PASS_APPROVED
      </text>
      <rect class="term-blink" x="380" y="-9" width="6" height="11" fill="#38BDF8" />
    </g>
  </g>

  <!-- RIGHT: REAL-TIME RADAR SCREEN (SCOPE &amp; TARGET BLIPS) -->
  <g transform="translate(535, 92)">
    <rect width="370" height="295" rx="12" fill="#0C0C18" fill-opacity="0.9" stroke="url(#simCardBorder)" stroke-width="1" />
    <rect width="370" height="28" rx="12" fill="rgba(124,134,255,0.1)" />
    <path d="M 12 1 L 358 1" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.75" />

    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#A5B4FC">
      RADAR INTERCEPT // AZIMUTH 360°
    </text>
    <rect x="290" y="6" width="65" height="16" rx="3" fill="rgba(16,185,129,0.15)" />
    <text x="322" y="17" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#10B981">ACTIVE</text>

    <!-- Concentric Radar Scope -->
    <g transform="translate(185, 165)">
      <circle cx="0" cy="0" r="105" fill="none" stroke="rgba(124,134,255,0.15)" stroke-width="0.75" />
      <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="0.75" stroke-dasharray="4 6" />
      <circle cx="0" cy="0" r="45" fill="none" stroke="rgba(124,134,255,0.25)" stroke-width="0.75" />
      <circle cx="0" cy="0" r="15" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="0.75" />

      <!-- Crosshairs -->
      <line x1="-115" y1="0" x2="115" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
      <line x1="0" y1="-115" x2="0" y2="115" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
      <line x1="-80" y1="-80" x2="80" y2="80" stroke="rgba(255,255,255,0.04)" stroke-width="0.5" stroke-dasharray="2 4" />
      <line x1="-80" y1="80" x2="80" y2="-80" stroke="rgba(255,255,255,0.04)" stroke-width="0.5" stroke-dasharray="2 4" />

      <!-- Rotating Radar Beam -->
      <path class="radar-beam-arm" d="M 0 0 L 102 -25 A 105 105 0 0 1 105 0 Z" fill="url(#radarSweepCone)" />
      <line class="radar-beam-arm" x1="0" y1="0" x2="105" y2="0" stroke="#38BDF8" stroke-width="1.2" />

      <!-- Radar Blip 1: RELIANCE (Approved) -->
      <g transform="translate(45, -35)">
        <circle class="blip-pass" cx="0" cy="0" r="3.5" fill="#10B981" />
        <circle cx="0" cy="0" r="8" fill="none" stroke="#10B981" stroke-width="0.75" opacity="0.5" />
        <text x="10" y="3" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#10B981">RELIANCE</text>
      </g>

      <!-- Radar Blip 2: TCS (Vetoed Fat-Finger) -->
      <g transform="translate(-55, 45)">
        <circle class="blip-veto" cx="0" cy="0" r="4.5" fill="#EF4444" />
        <circle cx="0" cy="0" r="10" fill="none" stroke="#EF4444" stroke-width="0.75" opacity="0.6" />
        <text x="-48" y="3" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#EF4444">TCS [VETO]</text>
      </g>

      <!-- Radar Blip 3: HDFCBANK (Collar Veto) -->
      <g transform="translate(60, 50)">
        <circle class="blip-veto" cx="0" cy="0" r="4" fill="#F59E0B" />
        <text x="8" y="3" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#F59E0B">HDFC [COLLAR]</text>
      </g>

      <!-- Radar Blip 4: INFY (Approved) -->
      <g transform="translate(-45, -55)">
        <circle class="blip-pass" cx="0" cy="0" r="3.5" fill="#38BDF8" />
        <text x="-35" y="3" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#38BDF8">INFY</text>
      </g>

      <!-- Radar Center Core -->
      <circle cx="0" cy="0" r="4" fill="#7C86FF" />
    </g>
  </g>

  <!-- Footer Telemetry &amp; Author Stamp -->
  <g transform="translate(45, 415)">
    <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#475569">
      ENGINEERED BY <tspan fill="#E2E8F0" font-weight="700">SUBHAM JENA</tspan> // DECOYINDIA // REAL-TIME RISK VETO ENGINE
    </text>
    <text x="700" y="0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#64748B">
      TEST COVERAGE: <tspan fill="#10B981">100% PASS (ZERO BYPASS)</tspan>
    </text>
  </g>

  <!-- Corner Coordinates -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="0.75">
    <path d="M 35 28 L 45 28 M 35 28 L 35 38" />
    <path d="M 915 28 L 905 28 M 915 28 L 915 38" />
    <path d="M 35 432 L 45 432 M 35 432 L 35 422" />
    <path d="M 915 432 L 905 432 M 915 432 L 915 422" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="auto">
  <defs>
    <!-- Aurora &amp; Reservoir Spotlights -->
    <radialGradient id="govSpot1" cx="25%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="govSpot2" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Glass Gradients -->
    <linearGradient id="flaskGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="flaskBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#7C86FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="tokenFluidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="sebiMeterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="20%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#64748B" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Micro Grid -->
    <pattern id="govGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.75" />
    </pattern>

    <!-- Clip Path for Fluid Reservoir -->
    <clipPath id="flaskClip">
      <rect x="0" y="0" width="160" height="200" rx="14" />
    </clipPath>
  </defs>

  <style>
    /* Kinetic Token Drops and Fluid Sloshing */
    @keyframes tokenDropFlow {
      0% { transform: translateY(-40px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(45px); opacity: 0; }
    }
    @keyframes orderPaceStream {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(240px); opacity: 0; }
    }
    @keyframes meterSweepPulse {
      0%, 100% { filter: drop-shadow(0 0 4px #38BDF8); }
      50% { filter: drop-shadow(0 0 12px #38BDF8); }
    }
    @keyframes beaconBlinkFast {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #10B981); }
      50% { opacity: 0.35; filter: none; }
    }

    .drop-token-1 { animation: tokenDropFlow 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .drop-token-2 { animation: tokenDropFlow 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s infinite; }
    .paced-order-1 { animation: orderPaceStream 2.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .paced-order-2 { animation: orderPaceStream 2.5s cubic-bezier(0.16, 1, 0.3, 1) 1.25s infinite; }
    .gauge-pulse { animation: meterSweepPulse 2.8s ease-in-out infinite; }
    .green-flash { animation: beaconBlinkFast 1.6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .drop-token-1, .drop-token-2, .paced-order-1, .paced-order-2,
      .gauge-pulse, .green-flash {
        animation: none !important;
      }
    }
  </style>

  <!-- Obsidian Canvas Floor -->
  <rect width="950" height="440" fill="#060609" rx="20" />
  <rect width="950" height="440" fill="url(#govGrid)" rx="20" />

  <!-- Aurora Mesh Spotlights -->
  <circle cx="200" cy="220" r="180" fill="url(#govSpot1)" />
  <circle cx="750" cy="220" r="180" fill="url(#govSpot2)" />

  <!-- HEADER TITLE &amp; METADATA -->
  <g transform="translate(45, 36)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5px">
      SEBI COMPLIANCE ENVELOPE // 2.0 OPS TOKEN BUCKET GOVERNOR
    </text>
    <text y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#94A3B8">
      DECOYINDIA // STRICT 5x SAFETY MARGIN BELOW SEBI 10 OPS EXCHANGE ALGO REGISTRATION
    </text>

    <!-- Top Right Status Badges -->
    <g transform="translate(620, -6)">
      <rect x="0" y="0" width="135" height="24" rx="4" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="0.75" />
      <circle class="green-flash" cx="12" cy="12" r="3.5" fill="#10B981" />
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10B981">GOVERNOR: ARMED</text>

      <rect x="145" y="0" width="135" height="24" rx="4" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="0.75" />
      <text x="14" y="15" transform="translate(145,0)" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8">5x BUFFER PRESERVED</text>
    </g>
  </g>

  <!-- Hairline Divider -->
  <line x1="45" y1="76" x2="905" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />

  <!-- SEBI COMPLIANCE COMPARISON SPECTRUM GAUGE (TOP SECTION) -->
  <g transform="translate(45, 92)">
    <rect width="860" height="66" rx="10" fill="#0D0D18" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />

    <!-- Gauge Track -->
    <g transform="translate(20, 18)">
      <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#E2E8F0">
        RATE LIMIT SPECTRUM:
      </text>
      <!-- Base Bar -->
      <rect x="150" y="2" width="670" height="12" rx="6" fill="#181828" stroke="rgba(255,255,255,0.06)" stroke-width="0.5" />
      <!-- Spectrum Fill -->
      <rect x="150" y="2" width="670" height="12" rx="6" fill="url(#sebiMeterGrad)" opacity="0.65" />

      <!-- XenAlgo Hard Ceiling Marker (2.0 OPS -> 20% of 10) -->
      <!-- 150 + 0.20 * 670 = 150 + 134 = 284 -->
      <line class="gauge-pulse" x1="284" y1="-4" x2="284" y2="20" stroke="#38BDF8" stroke-width="2.5" />
      <polygon points="284,-6 280,-12 288,-12" fill="#38BDF8" />
      <text x="284" y="-16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#38BDF8">
        XENALGO CEILING: 2.0 OPS
      </text>

      <!-- 5x Buffer Span Label -->
      <!-- From 284 to 820 -->
      <line x1="294" y1="26" x2="810" y2="26" stroke="#10B981" stroke-width="1" stroke-dasharray="3 3" />
      <text x="552" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#10B981">
        ← 5x REGULATORY SAFETY BUFFER (8.0 OPS FREE HEADROOM) →
      </text>

      <!-- SEBI Statutory Limit Marker (10.0 OPS -> 100% -> 820) -->
      <line x1="820" y1="-4" x2="820" y2="20" stroke="#EF4444" stroke-width="2" />
      <polygon points="820,-6 816,-12 824,-12" fill="#EF4444" />
      <text x="820" y="-16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#EF4444">
        SEBI 10.0 OPS REGISTRATION THRESHOLD
      </text>
    </g>
  </g>

  <!-- MAIN LOWER THEATER: LIQUID RESERVOIR + PACED EXECUTION DISPATCH -->
  <g transform="translate(45, 175)">
    <!-- LEFT: LIQUID GLASS TOKEN BUCKET RESERVOIR -->
    <g transform="translate(0, 0)">
      <rect width="260" height="210" rx="12" fill="#0C0C18" fill-opacity="0.88" stroke="url(#flaskBorderGrad)" stroke-width="1" />
      <rect width="260" height="28" rx="12" fill="rgba(56,189,248,0.1)" />
      <!-- Specular Rim Edge -->
      <path d="M 12 1 L 248 1" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.75" />

      <text x="14" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38BDF8">
        TOKEN BUCKET RESERVOIR
      </text>
      <circle cx="244" cy="14" r="3.5" fill="#10B981" />

      <!-- Refill Valve at Top -->
      <g transform="translate(50, 42)">
        <!-- Valve Pipe -->
        <rect x="25" y="0" width="20" height="15" rx="3" fill="#1F293D" stroke="#38BDF8" stroke-width="0.75" />
        <text x="55" y="12" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8">
          REFILL: +2.0 TOKENS/SEC
        </text>

        <!-- Kinetic Falling Tokens -->
        <g class="drop-token-1">
          <circle cx="35" cy="20" r="5" fill="#38BDF8" />
          <text x="35" y="23" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="800" fill="#060609">T</text>
        </g>
        <g class="drop-token-2">
          <circle cx="35" cy="20" r="5" fill="#10B981" />
          <text x="35" y="23" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="800" fill="#060609">T</text>
        </g>
      </g>

      <!-- Sloshing Liquid Glass Chamber -->
      <g transform="translate(50, 85)">
        <rect width="160" height="110" rx="10" fill="#101020" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
        <!-- Fluid Container with Morphing Path Wave -->
        <g clip-path="url(#flaskClip)">
          <path fill="url(#tokenFluidGrad)">
            <animate attributeName="d" dur="3.5s" repeatCount="indefinite"
              values="
                M 0 50 Q 40 40 80 50 T 160 50 L 160 110 L 0 110 Z;
                M 0 50 Q 40 60 80 45 T 160 50 L 160 110 L 0 110 Z;
                M 0 50 Q 40 40 80 50 T 160 50 L 160 110 L 0 110 Z" />
          </path>
        </g>
        <!-- Liquid Level Tick Marks -->
        <line x1="8" y1="35" x2="20" y2="35" stroke="rgba(255,255,255,0.4)" stroke-width="0.75" />
        <text x="24" y="38" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#38BDF8">2.0 MAX CAP</text>

        <line x1="8" y1="65" x2="16" y2="65" stroke="rgba(255,255,255,0.25)" stroke-width="0.75" />
        <text x="24" y="68" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="500" fill="#94A3B8">1.0 NOMINAL</text>

        <line x1="8" y1="95" x2="16" y2="95" stroke="rgba(255,255,255,0.25)" stroke-width="0.75" />
        <text x="24" y="98" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="500" fill="#64748B">0.0 EMPTY</text>
      </g>
    </g>

    <!-- CENTER CONDUIT &amp; KINETIC THROTTLER -->
    <g transform="translate(280, 0)">
      <!-- Conduit Housing -->
      <rect width="280" height="210" rx="12" fill="#0C0C18" fill-opacity="0.88" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <rect width="280" height="28" rx="12" fill="rgba(124,134,255,0.08)" />
      <text x="14" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#A5B4FC">
        ASYNC PACING QUEUE
      </text>

      <!-- Micro Flow Pipeline -->
      <line x1="20" y1="75" x2="260" y2="75" stroke="rgba(255,255,255,0.1)" stroke-width="3" />

      <!-- Paced Dispatched Orders Moving Through -->
      <g class="paced-order-1" transform="translate(20, 75)">
        <circle cx="0" cy="0" r="7" fill="#38BDF8" />
        <text x="0" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#060609">#1</text>
      </g>
      <g class="paced-order-2" transform="translate(20, 75)">
        <circle cx="0" cy="0" r="7" fill="#10B981" />
        <text x="0" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#060609">#2</text>
      </g>

      <!-- Pacing Rules Text -->
      <g transform="translate(18, 110)">
        <text font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#E2E8F0">
          DELTA DELAY: <tspan fill="#10B981">≥ 500ms</tspan>
        </text>
        <text y="20" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#94A3B8">
          • Bursts smoothed into deterministic pace
        </text>
        <text y="36" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#94A3B8">
          • Zero exchange flood risk
        </text>
        <text y="52" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#38BDF8">
          SI-3: Max 2.0 OPS Enforced
        </text>
      </g>
    </g>

    <!-- RIGHT: BROKER DISPATCH STREAM (FYERS v3 API) -->
    <g transform="translate(580, 0)">
      <rect width="280" height="210" rx="12" fill="#0C0C18" fill-opacity="0.88" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
      <rect width="280" height="28" rx="12" fill="rgba(16,185,129,0.12)" />
      <text x="14" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10B981">
        FYERS v3 API INGESTION
      </text>
      <circle cx="264" cy="14" r="3.5" fill="#10B981" />

      <!-- Live Dispatched Orders List -->
      <g transform="translate(14, 42)">
        <rect width="252" height="42" rx="6" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="0.75" />
        <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#E2E8F0">
          T: 15:05:00.000 // DISPATCHED
        </text>
        <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38BDF8">
          2026-11-24:std30:RELIANCE:BUY:001
        </text>
      </g>

      <g transform="translate(14, 94)">
        <rect width="252" height="42" rx="6" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="0.75" />
        <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#E2E8F0">
          T: 15:05:00.500 // DISPATCHED (+500ms)
        </text>
        <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38BDF8">
          2026-11-24:alpha_027:TCS:BUY:002
        </text>
      </g>

      <g transform="translate(14, 146)">
        <rect width="252" height="48" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="0.75" />
        <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#64748B">
          SEBI ALGO REGISTRATION:
        </text>
        <text x="12" y="34" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10B981">
          EXEMPT (OPS &lt; 10 ON OWN ACCOUNT)
        </text>
      </g>
    </g>
  </g>

  <!-- Footer Telemetry &amp; Author Stamp -->
  <g transform="translate(45, 405)">
    <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#475569">
      ENGINEERED BY <tspan fill="#E2E8F0" font-weight="700">SUBHAM JENA</tspan> // DECOYINDIA // COMPLIANCE DETERMINISTIC TOKEN BUCKET
    </text>
    <text x="700" y="0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#64748B">
      COMPLIANCE HEADROOM: <tspan fill="#10B981">80.0% FREE</tspan>
    </text>
  </g>

  <!-- Corner Coordinates -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="0.75">
    <path d="M 35 28 L 45 28 M 35 28 L 35 38" />
    <path d="M 915 28 L 905 28 M 915 28 L 915 38" />
    <path d="M 35 412 L 45 412 M 35 412 L 35 402" />
    <path d="M 915 412 L 905 412 M 915 412 L 915 402" />
  </g>
</svg>

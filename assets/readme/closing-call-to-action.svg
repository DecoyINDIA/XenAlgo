<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto">
  <defs>
    <radialGradient id="ctaCenterGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ctaTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>
    <pattern id="ctaGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes beaconPulse {
      0% { r: 8px; opacity: 0.9; }
      100% { r: 60px; opacity: 0; }
    }
    @keyframes auraFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .pulse-beacon {
      animation: beaconPulse 2.4s ease-out infinite;
    }
    .floating-beacon {
      animation: auraFloat 4s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-beacon, .floating-beacon {
        animation: none !important;
      }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="#0A0A0F" stroke="#222234" stroke-width="1.5" />
  <rect width="1200" height="380" fill="url(#ctaGrid)" rx="16" />
  <rect width="1200" height="380" fill="url(#ctaCenterGlow)" rx="16" />

  <!-- TOP PULSING BEACON (X: 600, Y: 60) -->
  <g class="floating-beacon" transform="translate(600, 60)">
    <circle class="pulse-beacon" cx="0" cy="0" r="15" fill="none" stroke="#7C86FF" stroke-width="1.5" />
    <circle cx="0" cy="0" r="28" fill="#141424" stroke="#7C86FF" stroke-width="1.5" />
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#7C86FF" />
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#FFFFFF" />
  </g>

  <!-- CENTER TYPOGRAPHY -->
  <g transform="translate(600, 130)">
    <!-- Eyebrow Badge -->
    <rect x="-140" y="0" width="280" height="24" rx="12" fill="#141424" stroke="rgba(124,134,255,0.3)" stroke-width="1" />
    <text x="0" y="16" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10.5" fill="#A5B4FC" letter-spacing="1.5">
      INSTITUTIONAL GRADE READINESS
    </text>

    <!-- Main Title -->
    <text x="0" y="52" text-anchor="middle" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="34" fill="url(#ctaTextGrad)" letter-spacing="-0.5">
      Autonomous Execution Built for Indian Equities
    </text>

    <!-- Subtitle -->
    <text x="0" y="82" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="14.5" fill="#94A3B8">
      Zero human intervention in the execution loop. 12 pure-veto invariants. 100% verified test coverage.
    </text>
  </g>

  <!-- 4 ACCEPTANCE GATES MATRIX (X: 100, Y: 245) -->
  <g transform="translate(100, 245)">
    <!-- Gate G0 -->
    <g transform="translate(0, 0)">
      <rect width="235" height="52" rx="8" fill="#11111E" stroke="#252538" stroke-width="1" />
      <circle cx="20" cy="26" r="5" fill="#10B981" />
      <text x="34" y="22" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#FFFFFF">G0: FOUNDATION</text>
      <text x="34" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#10B981">Schemas &amp; Mock Tests ✓</text>
    </g>

    <!-- Gate G1 -->
    <g transform="translate(255, 0)">
      <rect width="235" height="52" rx="8" fill="#11111E" stroke="#7C86FF" stroke-width="1.2" />
      <circle cx="20" cy="26" r="5" fill="#10B981" />
      <text x="34" y="22" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#FFFFFF">G1: PAPER CORE</text>
      <text x="34" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#10B981">Risk &amp; Execution Ready ✓</text>
    </g>

    <!-- Gate G2 -->
    <g transform="translate(510, 0)">
      <rect width="235" height="52" rx="8" fill="#11111E" stroke="#252538" stroke-width="1" />
      <circle cx="20" cy="26" r="5" fill="#38BDF8" />
      <text x="34" y="22" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#FFFFFF">G2: CONSOLE</text>
      <text x="34" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#38BDF8">FastAPI/HTMX/Tailscale ✓</text>
    </g>

    <!-- Gate G3 -->
    <g transform="translate(765, 0)">
      <rect width="235" height="52" rx="8" fill="#11111E" stroke="#252538" stroke-width="1" />
      <circle cx="20" cy="26" r="5" fill="#F59E0B" />
      <text x="34" y="22" font-family="'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#FFFFFF">G3: LIVE CAPITAL</text>
      <text x="34" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#F59E0B">30-Day Paper Drift Zero</text>
    </g>
  </g>

  <!-- BOTTOM METADATA BAR -->
  <g transform="translate(100, 335)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="0" y="24" font-family="'Cascadia Code', monospace" font-size="10" fill="#71717A">
      VERIFICATION: ./_source/.venv/Scripts/python.exe -m pytest -q // COMPLIANCE: SEBI 2-OPS CAP // LICENSE: PROPRIETARY
    </text>
    <text x="1000" y="24" text-anchor="end" font-family="'Cascadia Code', monospace" font-size="10" font-weight="700" fill="#7C86FF">
      XENALGO // REPO ROOT: /d/XOLVER/XenAlgo
    </text>
  </g>
</svg>

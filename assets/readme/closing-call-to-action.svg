<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <!-- Background Aurora &amp; Atmospheric Spotlights -->
    <radialGradient id="ctaSpotMain" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ctaSpotGreen" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ctaSpotViolet" cx="80%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Glass Gradients -->
    <linearGradient id="ctaGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="ctaGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#7C86FF" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="ctaTitleMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Micro Grid -->
    <pattern id="ctaGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.75" />
      <circle cx="30" cy="0" r="0.75" fill="rgba(124,134,255,0.25)" />
    </pattern>

    <!-- Beacon Glow Filter -->
    <filter id="beaconGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* GSAP Precision Bezier Motion Keyframes */
    @keyframes beaconExpandWave {
      0% { r: 12px; opacity: 0.9; stroke-width: 2px; }
      100% { r: 75px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes diamondFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.04); }
    }
    @keyframes terminalCursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes statusBlinkSlow {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #10B981); }
      50% { opacity: 0.4; filter: none; }
    }

    .beacon-wave-1 { animation: beaconExpandWave 2.8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .beacon-wave-2 { animation: beaconExpandWave 2.8s cubic-bezier(0.16, 1, 0.3, 1) 1.4s infinite; }
    .diamond-icon { animation: diamondFloat 4.5s ease-in-out infinite; }
    .term-cur { animation: terminalCursorBlink 0.9s step-start infinite; }
    .live-dot-pulse { animation: statusBlinkSlow 2s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .beacon-wave-1, .beacon-wave-2, .diamond-icon,
      .term-cur, .live-dot-pulse {
        animation: none !important;
      }
    }
  </style>

  <!-- Obsidian Canvas Floor -->
  <rect width="1200" height="400" fill="#060609" rx="22" />
  <rect width="1200" height="400" fill="url(#ctaGrid)" rx="22" />

  <!-- Aurora Mesh Spotlights -->
  <circle cx="600" cy="140" r="320" fill="url(#ctaSpotMain)" />
  <circle cx="200" cy="320" r="180" fill="url(#ctaSpotGreen)" />
  <circle cx="1000" cy="320" r="180" fill="url(#ctaSpotViolet)" />

  <!-- Main Glass Container Frame -->
  <g>
    <rect x="40" y="30" width="1120" height="340" rx="18" fill="#0A0A14" fill-opacity="0.85" stroke="url(#ctaGlassBorder)" stroke-width="1" />
    <path d="M 60 31 L 1140 31 A 18 18 0 0 1 1159 50" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.75" />
  </g>

  <!-- TOP PULSING HOLOGRAPHIC QUANTUM BEACON (X: 600, Y: 75) -->
  <g transform="translate(600, 75)">
    <!-- Expanding Waves -->
    <circle class="beacon-wave-1" cx="0" cy="0" r="14" fill="none" stroke="#7C86FF" />
    <circle class="beacon-wave-2" cx="0" cy="0" r="14" fill="none" stroke="#38BDF8" />

    <!-- Center Floating Holographic Diamond -->
    <g class="diamond-icon">
      <circle cx="0" cy="0" r="28" fill="#121226" stroke="#7C86FF" stroke-width="1.5" filter="url(#beaconGlowFilter)" />
      <!-- Stepped Xenon Diamond -->
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#1C1C36" stroke="#38BDF8" stroke-width="1" />
      <polygon points="0,-8 8,0 0,8 -8,0" fill="#7C86FF" />
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#FFFFFF" />
    </g>
  </g>

  <!-- CENTER TYPOGRAPHY &amp; TITLES -->
  <g transform="translate(600, 145)">
    <!-- Eyebrow Tag -->
    <g transform="translate(-165, -8)">
      <rect x="0" y="0" width="330" height="24" rx="12" fill="rgba(124,134,255,0.12)" stroke="rgba(124,134,255,0.3)" stroke-width="0.75" />
      <circle class="live-dot-pulse" cx="14" cy="12" r="3.5" fill="#10B981" />
      <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#A5B4FC" letter-spacing="1.5px">
        DECOYINDIA // INSTITUTIONAL GRADE READINESS
      </text>
    </g>

    <!-- Main Headline with Metallic Texture -->
    <text y="42" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="30" font-weight="900" fill="url(#ctaTitleMetallic)" letter-spacing="-1px">
      READY FOR AUTONOMOUS PRODUCTION DEPLOYMENT
    </text>

    <!-- Subtitle Line -->
    <text y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8">
      Zero Intervention in the Loop // Maximum Control Over the Loop // Verified on Live NSE Data
    </text>
  </g>

  <!-- QUICKSTART TERMINAL CODE CARD (CENTER LOWER) -->
  <g transform="translate(250, 245)">
    <rect width="700" height="68" rx="8" fill="#07070F" stroke="rgba(124,134,255,0.25)" stroke-width="1" />
    <rect width="700" height="20" rx="8" fill="rgba(255,255,255,0.03)" />

    <!-- Terminal Window Dots -->
    <circle cx="14" cy="10" r="3" fill="#EF4444" opacity="0.8" />
    <circle cx="26" cy="10" r="3" fill="#F59E0B" opacity="0.8" />
    <circle cx="38" cy="10" r="3" fill="#10B981" opacity="0.8" />
    <text x="56" y="13" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#64748B">bash — quickstart audit verification</text>

    <!-- Command Snippet -->
    <g transform="translate(18, 44)">
      <text font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#38BDF8">
        $ git clone https://github.com/DecoyINDIA/XenAlgo.git &amp;&amp; ./_source/.venv/Scripts/python.exe -m pytest tests/unit/ -q
      </text>
      <rect class="term-cur" x="655" y="-10" width="7" height="13" fill="#10B981" />
    </g>
  </g>

  <!-- BOTTOM CERTIFICATION PILLS (5 COLS) -->
  <g transform="translate(60, 335)">
    <!-- Pill 1: SI-1..SI-12 -->
    <g transform="translate(0, 0)">
      <rect width="195" height="22" rx="4" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="0.75" />
      <circle cx="10" cy="11" r="3" fill="#10B981" />
      <text x="20" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#10B981">SI-1..SI-12 PURE VETO [100%]</text>
    </g>
    <!-- Pill 2: 2.0 OPS -->
    <g transform="translate(210, 0)">
      <rect width="195" height="22" rx="4" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="0.75" />
      <circle cx="10" cy="11" r="3" fill="#38BDF8" />
      <text x="20" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38BDF8">SEBI 2.0 OPS GOVERNOR</text>
    </g>
    <!-- Pill 3: Fills Only -->
    <g transform="translate(420, 0)">
      <rect width="210" height="22" rx="4" fill="rgba(124,134,255,0.08)" stroke="rgba(124,134,255,0.25)" stroke-width="0.75" />
      <circle cx="10" cy="11" r="3" fill="#7C86FF" />
      <text x="20" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#A5B4FC">CONFIRMED FILLS // ZERO DRIFT</text>
    </g>
    <!-- Pill 4: Tailscale -->
    <g transform="translate(645, 0)">
      <rect width="210" height="22" rx="4" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="0.75" />
      <circle cx="10" cy="11" r="3" fill="#10B981" />
      <text x="20" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#10B981">TAILSCALE PRIVATE MESH</text>
    </g>
    <!-- Pill 5: Author -->
    <g transform="translate(870, 0)">
      <rect width="210" height="22" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
      <text x="14" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#CBD5E1">ARCHITECT: SUBHAM JENA</text>
    </g>
  </g>

  <!-- Corner Coordinates -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="0.75">
    <path d="M 45 35 L 55 35 M 45 35 L 45 45" />
    <path d="M 1155 35 L 1145 35 M 1155 35 L 1155 45" />
    <path d="M 45 365 L 55 365 M 45 365 L 45 355" />
    <path d="M 1155 365 L 1145 365 M 1155 365 L 1155 355" />
  </g>
</svg>

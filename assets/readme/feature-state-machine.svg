<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="auto">
  <defs>
    <!-- Aurora &amp; Spotlights -->
    <radialGradient id="smSpot1" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="smSpot2" cx="80%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#060609" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Glass Gradients -->
    <linearGradient id="nodeGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="nodeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#7C86FF" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="tradedNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Micro Grid -->
    <pattern id="smGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.75" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="fillIgniteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Precision GSAP State Machine Animations */
    @keyframes orderPipelineFlow {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes fillEventIgnite {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #10B981); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 14px #10B981); }
    }
    @keyframes cursorTerminal {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes movingPhoton {
      0% { transform: translateX(0px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(700px); opacity: 0; }
    }

    .pipeline-conduit {
      stroke-dasharray: 6 6;
      animation: orderPipelineFlow 2s linear infinite;
    }
    .ignite-box {
      transform-origin: 775px 145px;
      animation: fillEventIgnite 2.6s ease-in-out infinite;
    }
    .term-cursor { animation: cursorTerminal 0.9s step-start infinite; }
    .packet-runner { animation: movingPhoton 4s cubic-bezier(0.16, 1, 0.3, 1) infinite; }

    @media (prefers-reduced-motion: reduce) {
      .pipeline-conduit, .ignite-box, .term-cursor, .packet-runner {
        animation: none !important;
      }
    }
  </style>

  <!-- Obsidian Canvas Floor -->
  <rect width="950" height="440" fill="#060609" rx="20" />
  <rect width="950" height="440" fill="url(#smGrid)" rx="20" />

  <!-- Aurora Mesh Spotlights -->
  <circle cx="200" cy="200" r="180" fill="url(#smSpot1)" />
  <circle cx="780" cy="240" r="180" fill="url(#smSpot2)" />

  <!-- HEADER TITLE &amp; METADATA -->
  <g transform="translate(45, 36)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5px">
      CONFIRMED-FILLS STATE MACHINE &amp; APPEND-ONLY JOURNAL
    </text>
    <text y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#94A3B8">
      DECOYINDIA // POSITIONS MUTATE ONLY FROM CONFIRMED BROKER FILLS (SI-2 ZERO PHANTOM FILLS)
    </text>

    <!-- Top Right Status Badges -->
    <g transform="translate(640, -6)">
      <rect x="0" y="0" width="130" height="24" rx="4" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="0.75" />
      <circle cx="12" cy="12" r="3.5" fill="#10B981" />
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10B981">ZERO PHANTOM FILLS</text>

      <rect x="140" y="0" width="120" height="24" rx="4" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="0.75" />
      <text x="14" y="15" transform="translate(140,0)" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8">SQLITE WAL OK</text>
    </g>
  </g>

  <!-- Hairline Divider -->
  <line x1="45" y1="76" x2="905" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />

  <!-- TOP THEATER: 5-STAGE LIQUID GLASS STATE PIPELINE -->
  <g transform="translate(45, 95)">
    <!-- Conduit Connecting Rail Behind Nodes -->
    <line x1="60" y1="50" x2="800" y2="50" stroke="rgba(255,255,255,0.1)" stroke-width="3" />
    <line class="pipeline-conduit" x1="60" y1="50" x2="800" y2="50" stroke="#7C86FF" stroke-width="2" />

    <!-- Moving Packet Runner -->
    <g class="packet-runner" transform="translate(60, 50)">
      <circle cx="0" cy="0" r="4.5" fill="#38BDF8" />
    </g>

    <!-- STAGE 1: INTENT -->
    <g transform="translate(0, 0)">
      <rect width="145" height="100" rx="10" fill="#0D0D18" fill-opacity="0.88" stroke="url(#nodeBorderGrad)" stroke-width="1" />
      <rect width="145" height="24" rx="10" fill="rgba(124,134,255,0.12)" />
      <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#A5B4FC">01 // INTENT</text>
      <circle cx="132" cy="12" r="3" fill="#7C86FF" />

      <text x="12" y="44" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Strategy Signal</text>
      <text x="12" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#64748B">Pre-Risk Veto</text>

      <rect x="10" y="72" width="125" height="18" rx="3" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.25)" stroke-width="0.5" />
      <text x="14" y="84" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#EF4444">POSITIONS: 0 UNTOUCHED</text>
    </g>

    <!-- STAGE 2: SUBMITTED -->
    <g transform="translate(175, 0)">
      <rect width="145" height="100" rx="10" fill="#0D0D18" fill-opacity="0.88" stroke="url(#nodeBorderGrad)" stroke-width="1" />
      <rect width="145" height="24" rx="10" fill="rgba(56,189,248,0.12)" />
      <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38BDF8">02 // SUBMITTED</text>
      <circle cx="132" cy="12" r="3" fill="#38BDF8" />

      <text x="12" y="44" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Risk Approved</text>
      <text x="12" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#64748B">2.0 OPS Dispatched</text>

      <rect x="10" y="72" width="125" height="18" rx="3" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.25)" stroke-width="0.5" />
      <text x="14" y="84" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#EF4444">POSITIONS: 0 UNTOUCHED</text>
    </g>

    <!-- STAGE 3: PENDING -->
    <g transform="translate(350, 0)">
      <rect width="145" height="100" rx="10" fill="#0D0D18" fill-opacity="0.88" stroke="url(#nodeBorderGrad)" stroke-width="1" />
      <rect width="145" height="24" rx="10" fill="rgba(245,158,11,0.12)" />
      <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F59E0B">03 // PENDING</text>
      <circle cx="132" cy="12" r="3" fill="#F59E0B" />

      <text x="12" y="44" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Exchange In Flight</text>
      <text x="12" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#64748B">In NSE Book</text>

      <rect x="10" y="72" width="125" height="18" rx="3" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.25)" stroke-width="0.5" />
      <text x="14" y="84" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#EF4444">POSITIONS: 0 UNTOUCHED</text>
    </g>

    <!-- STAGE 4: PART_TRADED -->
    <g transform="translate(525, 0)">
      <rect width="150" height="100" rx="10" fill="#0D0D18" fill-opacity="0.88" stroke="url(#nodeBorderGrad)" stroke-width="1" />
      <rect width="150" height="24" rx="10" fill="rgba(124,134,255,0.12)" />
      <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#A5B4FC">04 // PART_TRADED</text>
      <circle cx="138" cy="12" r="3" fill="#7C86FF" />

      <text x="12" y="44" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Partial Execution</text>
      <text x="12" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#64748B">Filled: 140 / 280</text>

      <rect x="10" y="72" width="130" height="18" rx="3" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="0.5" />
      <text x="14" y="84" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#10B981">INCREMENTAL FILL LOGGED</text>
    </g>

    <!-- STAGE 5: TRADED (THE CONFIRMED FILL EVENT) -->
    <g class="ignite-box" transform="translate(705, 0)">
      <rect width="155" height="100" rx="10" fill="url(#tradedNodeGrad)" stroke="rgba(16,185,129,0.5)" stroke-width="1.5" filter="url(#fillIgniteGlow)" />
      <rect width="155" height="24" rx="10" fill="rgba(16,185,129,0.25)" />
      <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#10B981">05 // TRADED</text>
      <circle cx="142" cy="12" r="3.5" fill="#10B981" />

      <text x="12" y="44" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Confirmed Fill</text>
      <text x="12" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#A7F3D0">100% Filled (280/280)</text>

      <rect x="10" y="72" width="135" height="18" rx="3" fill="rgba(16,185,129,0.3)" stroke="rgba(16,185,129,0.6)" stroke-width="0.75" />
      <text x="14" y="84" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#FFFFFF">★ POSITIONS MUTATED</text>
    </g>
  </g>

  <!-- LOWER THEATER: APPEND-ONLY SQLITE WAL JOURNAL &amp; REPLAY AUDIT -->
  <g transform="translate(45, 215)">
    <rect width="860" height="175" rx="12" fill="#0B0B14" fill-opacity="0.9" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
    <rect width="860" height="26" rx="12" fill="rgba(124,134,255,0.08)" />

    <!-- Terminal Header Bar -->
    <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#E2E8F0">
      SQLITE WAL JOURNAL // schema: order_events (PRAGMA synchronous = FULL; WAL MODE)
    </text>
    <text x="730" y="17" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#10B981">
      WRITE-AHEAD LOG [OK]
    </text>

    <!-- Table Header Columns -->
    <g transform="translate(15, 45)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#64748B">SEQ</text>
      <text x="40" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#64748B">EVENT_TYPE</text>
      <text x="150" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#64748B">CORRELATION_ID</text>
      <text x="430" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#64748B">STATUS</text>
      <text x="540" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#64748B">QTY</text>
      <text x="610" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#64748B">FILL_PX</text>
      <text x="690" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#64748B">REPLAY_MUTATION</text>
      <line x1="0" y1="8" x2="830" y2="8" stroke="rgba(255,255,255,0.06)" stroke-width="0.75" />
    </g>

    <!-- Table Rows -->
    <!-- Row 1: INTENT -->
    <g transform="translate(15, 72)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">#1082</text>
      <text x="40" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#7C86FF">ORDER_INTENT</text>
      <text x="150" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#CBD5E1">2026-11-24:std30:RELIANCE:BUY:001</text>
      <text x="430" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">INTENT</text>
      <text x="540" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">280</text>
      <text x="610" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">₹2,842.00</text>
      <text x="690" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#EF4444">NO-OP (0)</text>
    </g>

    <!-- Row 2: SUBMITTED -->
    <g transform="translate(15, 96)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">#1083</text>
      <text x="40" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#38BDF8">ORDER_SUBMITTED</text>
      <text x="150" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#CBD5E1">2026-11-24:std30:RELIANCE:BUY:001</text>
      <text x="430" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#38BDF8">SUBMITTED</text>
      <text x="540" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">280</text>
      <text x="610" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94A3B8">₹2,842.00</text>
      <text x="690" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#EF4444">NO-OP (0)</text>
    </g>

    <!-- Row 3: BROKER FILL CONFIRMED (POSITION LEDGER IGNITED) -->
    <g transform="translate(15, 120)">
      <rect x="-4" y="-12" width="838" height="22" rx="4" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="0.75" />
      <text x="0" y="2" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#10B981">#1084</text>
      <text x="40" y="2" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#10B981">BROKER_FILL</text>
      <text x="150" y="2" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FFFFFF">2026-11-24:std30:RELIANCE:BUY:001</text>
      <text x="430" y="2" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#10B981">TRADED</text>
      <text x="540" y="2" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#FFFFFF">280</text>
      <text x="610" y="2" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#10B981">₹2,841.80</text>
      <text x="690" y="2" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#10B981">POSITIONS: +280 [CONFIRMED]</text>
    </g>

    <!-- Bottom Journal Status Bar -->
    <g transform="translate(15, 155)">
      <text font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#64748B">
        sqlite3 journal.db "SELECT count(*) FROM order_events WHERE correlation_id='2026-11-24:std30:RELIANCE:BUY:001';" → <tspan fill="#38BDF8">3 events</tspan>
      </text>
      <rect class="term-cursor" x="780" y="-8" width="6" height="11" fill="#38BDF8" />
    </g>
  </g>

  <!-- Footer Telemetry &amp; Author Stamp -->
  <g transform="translate(45, 412)">
    <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#475569">
      ENGINEERED BY <tspan fill="#E2E8F0" font-weight="700">SUBHAM JENA</tspan> // DECOYINDIA // STRICT CONFIRMED-FILL STATE MACHINE
    </text>
    <text x="680" y="0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#64748B">
      STATE VERIFICATION: <tspan fill="#10B981">100% AUDIT PASS</tspan>
    </text>
  </g>

  <!-- Corner Coordinates -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="0.75">
    <path d="M 35 28 L 45 28 M 35 28 L 35 38" />
    <path d="M 915 28 L 905 28 M 915 28 L 915 38" />
    <path d="M 35 412 L 45 412 M 35 412 L 35 402" />
    <path d="M 915 412 L 905 412 M 915 412 L 915 402" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="heroXenonGlow" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0A0A0F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="heroCyanGlow" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#0A0A0F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radarCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C86FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7C86FF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C86FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#7C86FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
      <circle cx="40" cy="0" r="1" fill="rgba(124,134,255,0.2)" />
    </pattern>

    <!-- Filter Glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0% { r: 12px; opacity: 0.8; }
      50% { r: 24px; opacity: 0.1; }
      100% { r: 32px; opacity: 0; }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #10B981); }
      50% { opacity: 0.4; filter: none; }
    }
    @keyframes scanLine {
      0% { transform: translateY(-10px); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(480px); opacity: 0; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blipFade {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #38BDF8); }
    }
    @keyframes floatText {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .radar-beam {
      transform-origin: 940px 250px;
      animation: radarSpin 6s linear infinite;
    }
    .pulse-ring-1 {
      animation: pulseRing 2.4s ease-out infinite;
    }
    .pulse-ring-2 {
      animation: pulseRing 2.4s ease-out 1.2s infinite;
    }
    .status-dot {
      animation: statusBlink 2s ease-in-out infinite;
    }
    .scanner {
      animation: scanLine 7s ease-in-out infinite;
    }
    .dash-flow {
      stroke-dasharray: 8 6;
      animation: dashStream 3s linear infinite;
    }
    .blip-1 { transform-origin: 910px 200px; animation: blipFade 3s ease-in-out infinite; }
    .blip-2 { transform-origin: 980px 280px; animation: blipFade 2.4s ease-in-out 0.8s infinite; }
    .blip-3 { transform-origin: 890px 290px; animation: blipFade 3.6s ease-in-out 1.5s infinite; }
    .blip-4 { transform-origin: 1010px 190px; animation: blipFade 2.8s ease-in-out 2s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .radar-beam, .pulse-ring-1, .pulse-ring-2, .status-dot, .scanner, .dash-flow, .blip-1, .blip-2, .blip-3, .blip-4 {
        animation: none !important;
      }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="520" rx="16" fill="#0A0A0F" stroke="#232334" stroke-width="1.5" />
  <rect width="1200" height="520" fill="url(#cyberGrid)" rx="16" />
  <rect width="1200" height="520" fill="url(#heroXenonGlow)" rx="16" />
  <rect width="1200" height="520" fill="url(#heroCyanGlow)" rx="16" />

  <!-- Scanning light beam -->
  <line class="scanner" x1="40" y1="20" x2="1160" y2="20" stroke="url(#beamGrad)" stroke-width="1.5" />

  <!-- TOP HEADER / NAV BAR -->
  <g transform="translate(44, 38)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#161622" stroke="#7C86FF" stroke-width="1.5" />
    <path d="M7 7 L21 21 M21 7 L7 21" stroke="#7C86FF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="14" cy="14" r="3" fill="#38BDF8" />

    <text x="38" y="19" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" letter-spacing="1.5">XENALGO</text>
    <text x="115" y="19" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="500" font-size="12" fill="#71717A" letter-spacing="0.5">// AUTONOMOUS SWING ENGINE</text>

    <!-- Center System Status Badge -->
    <rect x="420" y="-3" width="310" height="34" rx="17" fill="#12121A" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
    <circle class="status-dot" cx="438" cy="14" r="4.5" fill="#10B981" />
    <circle cx="438" cy="14" r="10" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4" />
    <text x="454" y="18" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="11.5" fill="#E2E8F0" letter-spacing="0.5">STATUS: ONLINE</text>
    <text x="562" y="18" font-family="'Cascadia Code', monospace" font-size="11" fill="#10B981">G1_PAPER_VERIFIED</text>

    <!-- Right Env Info -->
    <text x="1110" y="18" text-anchor="end" font-family="'Cascadia Code', monospace" font-size="11" fill="#71717A">NSE:EQUITY | FYERS V3 | 2-OPS</text>
  </g>

  <!-- DIVIDER LINE -->
  <line x1="44" y1="78" x2="1156" y2="78" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- LEFT HERO TYPOGRAPHY & INTENT -->
  <g transform="translate(54, 120)">
    <!-- Eyebrow Badge -->
    <rect x="0" y="0" width="280" height="26" rx="6" fill="#151522" stroke="rgba(124,134,255,0.3)" stroke-width="1" />
    <text x="12" y="17" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#A5B4FC" letter-spacing="1">INSTITUTIONAL EXECUTION STACK</text>
    <rect x="238" y="6" width="32" height="14" rx="3" fill="#7C86FF" />
    <text x="254" y="16.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="9" fill="#0A0A0F">NSE</text>

    <!-- Main Title -->
    <text x="0" y="74" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="44" fill="url(#textGrad)" letter-spacing="-1">
      Autonomous Swing
    </text>
    <text x="0" y="126" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="44" fill="url(#textGrad)" letter-spacing="-1">
      Trading for Indian Equities
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="168" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="400" font-size="15" fill="#94A3B8">
      Zero human intervention in the execution loop. Hardened with 12 pure-veto
    </text>
    <text x="0" y="192" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="400" font-size="15" fill="#94A3B8">
      safety invariants, 3 orthogonal alpha sleeves, and a SEBI 2-OPS token bucket.
    </text>

    <!-- Feature Telemetry Badges -->
    <g transform="translate(0, 230)">
      <!-- Badge 1: Sleeves -->
      <g transform="translate(0, 0)">
        <rect width="138" height="52" rx="8" fill="#12121A" stroke="#252538" stroke-width="1" />
        <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#71717A">ALPHA SLEEVES</text>
        <text x="12" y="40" font-family="'Cascadia Code', monospace" font-size="16" font-weight="700" fill="#7C86FF">3 Parallel</text>
      </g>
      <!-- Badge 2: Safety Invariants -->
      <g transform="translate(148, 0)">
        <rect width="138" height="52" rx="8" fill="#12121A" stroke="#252538" stroke-width="1" />
        <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#71717A">SAFETY INVARIANTS</text>
        <text x="12" y="40" font-family="'Cascadia Code', monospace" font-size="16" font-weight="700" fill="#10B981">12 Vetoes</text>
      </g>
      <!-- Badge 3: Governor Rate -->
      <g transform="translate(296, 0)">
        <rect width="138" height="52" rx="8" fill="#12121A" stroke="#252538" stroke-width="1" />
        <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#71717A">RATE GOVERNOR</text>
        <text x="12" y="40" font-family="'Cascadia Code', monospace" font-size="16" font-weight="700" fill="#38BDF8">2.0 OPS</text>
      </g>
      <!-- Badge 4: Journal -->
      <g transform="translate(444, 0)">
        <rect width="150" height="52" rx="8" fill="#12121A" stroke="#252538" stroke-width="1" />
        <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#71717A">EVENT SOURCING</text>
        <text x="12" y="40" font-family="'Cascadia Code', monospace" font-size="16" font-weight="700" fill="#E2E8F0">SQLite WAL</text>
      </g>
    </g>

    <!-- Command Pill -->
    <g transform="translate(0, 304)">
      <rect width="360" height="34" rx="8" fill="#0E0E16" stroke="rgba(124,134,255,0.25)" stroke-width="1" />
      <text x="14" y="22" font-family="'Cascadia Code', monospace" font-size="12" fill="#71717A">$</text>
      <text x="30" y="22" font-family="'Cascadia Code', monospace" font-size="12" fill="#A5B4FC">pytest -q</text>
      <text x="125" y="22" font-family="'Cascadia Code', monospace" font-size="11" fill="#10B981"># 100% Phase 1 Specs Passing</text>
    </g>
  </g>

  <!-- RIGHT RADAR HUD / TELEMETRY CONSOLE -->
  <g transform="translate(720, 105)">
    <!-- Panel Container -->
    <rect width="436" height="365" rx="12" fill="#0D0D14" stroke="#232338" stroke-width="1" />
    <rect width="436" height="32" rx="12" fill="#13131F" />
    <rect width="436" height="1" y="32" fill="rgba(255,255,255,0.08)" />

    <!-- Panel Header -->
    <circle cx="20" cy="16" r="4" fill="#EF4444" opacity="0.8" />
    <circle cx="34" cy="16" r="4" fill="#F59E0B" opacity="0.8" />
    <circle cx="48" cy="16" r="4" fill="#10B981" opacity="0.8" />
    <text x="70" y="20" font-family="'Cascadia Code', monospace" font-size="11" font-weight="600" fill="#94A3B8">TELEMETRY_RADAR // LIVE NSE SCANNER</text>
    <rect x="350" y="7" width="70" height="18" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="0.8" />
    <text x="385" y="19" text-anchor="middle" font-family="'Cascadia Code', monospace" font-size="9" font-weight="700" fill="#10B981">ARMED</text>

    <!-- Circular Radar Scope -->
    <g transform="translate(220, 150)">
      <!-- Radar Background & Rings -->
      <circle cx="0" cy="0" r="105" fill="#09090E" stroke="rgba(124,134,255,0.2)" stroke-width="1" />
      <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(124,134,255,0.15)" stroke-width="1" />
      <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(124,134,255,0.2)" stroke-width="1" />
      <circle cx="0" cy="0" r="25" fill="none" stroke="rgba(124,134,255,0.25)" stroke-width="1" />
      <circle cx="0" cy="0" r="105" fill="url(#radarCenterGlow)" />

      <!-- Crosshairs -->
      <line x1="-105" y1="0" x2="105" y2="0" stroke="rgba(124,134,255,0.15)" stroke-width="1" />
      <line x1="0" y1="-105" x2="0" y2="105" stroke="rgba(124,134,255,0.15)" stroke-width="1" />
      <line x1="-74" y1="-74" x2="74" y2="74" stroke="rgba(124,134,255,0.08)" stroke-width="1" stroke-dasharray="2 4" />
      <line x1="-74" y1="74" x2="74" y2="-74" stroke="rgba(124,134,255,0.08)" stroke-width="1" stroke-dasharray="2 4" />

      <!-- Radar Rotating Beam -->
      <g class="radar-beam" style="transform-origin: 0px 0px;">
        <path d="M 0 0 L 105 0 A 105 105 0 0 0 74 -74 Z" fill="url(#radarSweepGrad)" />
        <line x1="0" y1="0" x2="105" y2="0" stroke="#7C86FF" stroke-width="2" />
      </g>

      <!-- Center Pulse -->
      <circle cx="0" cy="0" r="4" fill="#7C86FF" />
      <circle class="pulse-ring-1" cx="0" cy="0" r="8" fill="none" stroke="#7C86FF" stroke-width="1.5" />
      <circle class="pulse-ring-2" cx="0" cy="0" r="8" fill="none" stroke="#38BDF8" stroke-width="1" />

      <!-- Detected Equity Blips -->
      <g class="blip-1" transform="translate(-40, -45)">
        <circle cx="0" cy="0" r="3.5" fill="#10B981" />
        <circle cx="0" cy="0" r="7" fill="none" stroke="#10B981" stroke-width="1" opacity="0.6" />
        <text x="8" y="3" font-family="'Cascadia Code', monospace" font-size="8" fill="#10B981" font-weight="700">TCS:BUY</text>
      </g>
      <g class="blip-2" transform="translate(48, 32)">
        <circle cx="0" cy="0" r="3.5" fill="#38BDF8" />
        <text x="8" y="3" font-family="'Cascadia Code', monospace" font-size="8" fill="#38BDF8" font-weight="700">INFY:BUY</text>
      </g>
      <g class="blip-3" transform="translate(-55, 38)">
        <circle cx="0" cy="0" r="3.5" fill="#7C86FF" />
        <text x="8" y="3" font-family="'Cascadia Code', monospace" font-size="8" fill="#A5B4FC" font-weight="700">HDFCBANK</text>
      </g>
      <g class="blip-4" transform="translate(62, -50)">
        <circle cx="0" cy="0" r="3" fill="#EF4444" />
        <text x="7" y="3" font-family="'Cascadia Code', monospace" font-size="8" fill="#EF4444" font-weight="700">RELIANCE:VETO</text>
      </g>
    </g>

    <!-- Side Data Feeds -->
    <g transform="translate(20, 50)">
      <text font-family="'Cascadia Code', monospace" font-size="9" fill="#71717A">FEED_STREAM</text>
      <text y="16" font-family="'Cascadia Code', monospace" font-size="11" font-weight="600" fill="#38BDF8">FYERS_WS_V3</text>
      <text y="30" font-family="'Cascadia Code', monospace" font-size="9" fill="#10B981">LATENCY: 0.82ms</text>

      <text y="60" font-family="'Cascadia Code', monospace" font-size="9" fill="#71717A">CAPITAL_NAV</text>
      <text y="76" font-family="'Cascadia Code', monospace" font-size="11" font-weight="600" fill="#E2E8F0">₹10,00,000</text>
      <text y="90" font-family="'Cascadia Code', monospace" font-size="9" fill="#7C86FF">ALLOC: 33/33/33%</text>

      <text y="120" font-family="'Cascadia Code', monospace" font-size="9" fill="#71717A">RISK_ENGINE</text>
      <text y="136" font-family="'Cascadia Code', monospace" font-size="11" font-weight="600" fill="#10B981">12/12 INVARIANTS</text>
      <text y="150" font-family="'Cascadia Code', monospace" font-size="9" fill="#94A3B8">ZERO VETO BYPASS</text>
    </g>

    <!-- Bottom Telemetry Terminal Log Bar -->
    <g transform="translate(18, 275)">
      <rect width="400" height="74" rx="8" fill="#08080C" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="14" y="20" font-family="'Cascadia Code', monospace" font-size="9.5" fill="#71717A">[15:00:02.104] SLEEVE_SIGNAL: std30 triggered INFY.NS buy 120 qty</text>
      <text x="14" y="38" font-family="'Cascadia Code', monospace" font-size="9.5" fill="#10B981">[15:00:02.108] RISK_ENGINE: Pure veto check passed (12/12 gates OK)</text>
      <text x="14" y="56" font-family="'Cascadia Code', monospace" font-size="9.5" fill="#38BDF8">[15:00:02.112] GOVERNOR: Token acquired (0.50/2.0 OPS) → Fyers LIMIT</text>
    </g>
  </g>
</svg>
